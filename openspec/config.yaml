schema: spec-driven

# 项目上下文：AI 创建产物时会读取此段。
context: |
  SaiFlow — 面向泰国 SME 制造企业的纸质单据 OCR 数字化录入系统（“We turn paper into process.”）。

  技术栈：
  - 后端：Python >=3.12 + FastAPI（services/api，STD-005），Cloud Run 部署；Cloud SQL PostgreSQL、私有 GCS、Firestore、Cloud Functions、Secret Manager。
  - 前端：React（apps/web-pc：Ant Design；apps/line-mini：Ant Design Mobile，STD-006）；共享库 packages/*。
  - legacy/ 为旧代码只读参考，不参与构建，不被新代码引用。
  - 工具链：pnpm workspace 管理 JS（apps/*、packages/*）；services/ 为独立 Python 工具链，不在 pnpm glob 内。

  文档分层：
  - 过程（变更提案 / delta spec / 任务）在 openspec/；成果（产品级持久文档）在 docs/。
  - docs/ 统一为 SaiFlow 唯一文档根（00/01/10/20/30/40），旧 saiflow-docs 已废弃，内容已完成迁移。
  - 术语唯一来源：docs/10-product/Glossary.md。
  - 人类 AI 入口见 AGENTS.md 与 AI-WORKFLOW.md；OpenSpec 只管需求（proposal + delta spec），实现阶段由 SuperPowers 承担（plan.md、verification.md），见 AI-WORKFLOW.md。

  通用规则：
  - 复用 OpenSpec 官方 skill，只做叠加约束，不重造流程。
  - 一切产物只写 openspec/changes/<change>/，禁止另建全局过程目录。
  - V1.0 只实现 P0，禁止范围蔓延。
  - 禁止臆造需求；缺口记为 open question。

# 每类产物的额外规则。
rules:
  proposal:
    - 变更名使用 kebab-case。
    - 必须引用 docs/10-product 或 docs/20-requirements 中对应的产品诉求来源。
    - 需列出“非目标（Non-goals）”。
  spec:
    - 每条需求至少 1 条 Gherkin 验收标准（Given/When/Then）。
    - 术语使用 docs/10-product/Glossary.md 的精确名称。
    - 需求原子化、可测，使用 SHALL/SHOULD/MAY。

# archive 操作的指导（实现阶段由 SuperPowers 承担，不使用 /opsx:apply）。
operations:
  archive:
    guidance:
      - 归档前确认 verification.md 中全部 AC 为通过或已说明。
      - 纯文档 / 基础设施 change 在 .openspec.yaml 中设 skip_specs: true，归档使用 --skip-specs。
