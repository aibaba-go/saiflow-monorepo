openapi: 3.0.3
info:
  title: SaiFlow API
  version: 1.0.0
  description: |
    SaiFlow 后端接口（Flask，`services/api`）。本文件是对外接口契约的唯一来源，
    `docs/30-design/API-Spec.md` 由其生成发布，请勿手写第二份。

    ## 通用约定
    - 所有业务接口位于 `/api/v1`；未启用版本（如 `/api/v2/...`）与旧的无版本 `/api/...` 业务路径一律 404。
    - 成功响应：`{"code": "OK", "data": ...}`（见 `OkEnvelope`）。
    - 失败响应：`{"code", "message_key", "request_id", "retryable", "field_errors"}`（见 `Error`），
      `message_key` 为前端 i18n 文案键。
    - 时间字段为 UTC 的 ISO 8601 字符串（无时区后缀）。

    ## 认证与 CSRF
    - 免登录白名单（精确匹配）：`POST /auth/line`、`POST /auth/guest`；其余接口必须携带会话 Cookie `saiflow_session`（HttpOnly，path=/api）。
    - 写请求（POST/PUT/PATCH/DELETE）还必须携带请求头 `X-CSRF-Token`，其值来自登录 / `GET /auth/session` 响应中的 `csrf_token`。
    - 跨用户 / 跨企业访问不存在或无权的对象统一返回 404，不泄露资源存在性。

    ## 错误码
    | HTTP | code | 说明 |
    |------|------|------|
    | 400 | INVALID_ARGUMENT | 参数校验失败，`field_errors` 给出字段级原因 |
    | 401 | AUTH_REQUIRED / SESSION_EXPIRED / SESSION_REVOKED | 未登录 / 会话过期 / 会话已吊销 |
    | 402 | QUOTA_EXCEEDED | 免费 OCR 任务额度不足 |
    | 403 | ACCOUNT_DISABLED / PERMISSION_DENIED / CSRF_INVALID / ENTERPRISE_ACCESS_REVOKED | 账号禁用 / 无权限 / CSRF 校验失败 / 企业访问权已撤销 |
    | 404 | RESOURCE_NOT_FOUND | 资源不存在或无权访问 |
    | 409 | STATE_CONFLICT / VERSION_CONFLICT | 状态不允许 / 乐观并发版本冲突 |
    | 429 | RATE_LIMITED | 请求过于频繁（retryable=true） |
    | 503 | SERVICE_UNAVAILABLE / AUTH_SERVICE_UNAVAILABLE / OCR_VENDOR_UNAVAILABLE / EMAIL_SERVICE_UNAVAILABLE / STORAGE_UNAVAILABLE / EXPORT_UNAVAILABLE / EXPORT_FAILED | 依赖服务不可用 |
servers:
  - url: /api/v1
    description: 当前部署（相对路径）
  - url: https://saiflow-api-920915040833.asia-southeast1.run.app/api/v1
    description: Cloud Run 正式环境
  - url: http://localhost:5000/api/v1
    description: 本地开发
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: 登录、游客会话、会话查询与注销
  - name: Me
    description: 当前用户资料、注册、邮箱、工作空间、通知与数据请求
  - name: Plans
    description: 套餐与订阅
  - name: Files
    description: 文件上传（上传会话）与原件访问
  - name: OCR
    description: OCR 识别任务
  - name: Results
    description: 识别结果查询与人工核验修改
  - name: Exports
    description: 结果导出与下载
  - name: Enterprises
    description: 企业创建、认证资料、绑定与解绑
  - name: Applications
    description: 入企申请与企业邀请
  - name: Ops
    description: 运维端点（不在 /api/v1 下）
paths:
  /auth/line:
    post:
      tags: [Auth]
      summary: LINE 登录换取会话
      description: |
        用 LINE ID token 换取 SaiFlow 会话（免登录白名单接口，精确匹配 POST，不校验 CSRF）。

        正常流程：服务端以 POST form 调用 LINE `https://api.line.me/oauth2/v2.1/verify`
        （id_token + client_id=LINE_CHANNEL_ID）验真，并本地复核 iss=`https://access.line.me`、
        aud 包含渠道 ID、exp 未过期。按 (line_provider=line, line_sub=sub) 新建或复用用户；
        未完成注册（registered=false）的用户会用 LINE 资料（name/picture/email/phone_number）
        刷新 display_name/avatar_url/email/phone，已注册用户的资料不被覆盖。

        AUTH_DEV_MODE 开发兜底：当 `id_token` 为空、提供 `dev_id` 且服务端开启 AUTH_DEV_MODE 时，
        以 line_sub=`dev:<dev_id>` 建立开发身份（首次创建时随机生成昵称、手机号、邮箱（约 1/3 概率为空）
        与首字母 PNG 头像）；dev_id 超过 64 字符返回 400 `error.invalid_argument`。
        未开启 AUTH_DEV_MODE 时 dev_id 被忽略，按缺少 id_token 处理。

        游客归并：若请求携带有效的游客会话 Cookie，登录成功后游客的全部数据（文件、任务、结果版本、导出、
        申请、通知、审计、配额流水、成员关系等）归并到该真实账号，游客账号及其会话被删除，游客首登赠送作废。

        成功后签发新会话（Set-Cookie `saiflow_session`，HttpOnly）并下发明文 CSRF token；
        首次登录幂等发放个人空间 1,000 次免费 OCR 任务。`language` 仅接受 th/en，其他值忽略。

        错误：
        - 400 INVALID_ARGUMENT `auth.id_token_required`（未提供 id_token 且未走开发兜底）、`error.invalid_argument`（dev_id 过长）
        - 401 AUTH_REQUIRED `auth.line_token_invalid`（LINE 验真非 200 或 iss 不符）、`auth.line_channel_mismatch`、`auth.line_token_expired`
        - 503 AUTH_SERVICE_UNAVAILABLE `auth.line_not_configured`（未配置 LINE_CHANNEL_ID）、`auth.line_verify_unavailable`（调用 LINE 网络失败），retryable=true
      operationId: authLine
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLineRequest'
      responses:
        '200':
          description: 登录成功，已签发会话 Cookie
          headers:
            Set-Cookie:
              description: "saiflow_session=<token>; HttpOnly; Max-Age=<绝对过期秒数>"
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthPayload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/guest:
    post:
      tags: [Auth]
      summary: 创建或复用游客会话
      description: |
        免登录白名单接口（不校验 CSRF）。若请求已携带有效会话（游客或真实用户），直接复用该会话：
        轮换 CSRF token 并返回当前用户与工作空间，不签发新 Cookie。
        否则新建游客用户（line_provider=guest，display_name=Guest，status=ACTIVE），签发新会话
        （Set-Cookie `saiflow_session`），并幂等发放个人空间 1,000 次免费 OCR 任务。
        游客可上传与核验，之后经 POST /auth/line 登录时数据自动归并到真实账号。
        `language` 仅接受 th/en，其他值忽略（默认 th）。
      operationId: authGuest
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
                  enum: [th, en]
                  description: 界面语言；非 th/en 时忽略
      responses:
        '200':
          description: 游客会话已建立或复用（仅新建时返回 Set-Cookie）
          headers:
            Set-Cookie:
              description: 新建游客会话时下发 saiflow_session（HttpOnly）
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthPayload'

  /auth/session:
    get:
      tags: [Auth]
      summary: 获取当前会话并轮换 CSRF
      description: |
        返回当前会话摘要（用户、工作空间、签发与绝对过期时间），并轮换下发新的 CSRF token
        （旧 CSRF token 立即失效）。需登录态（游客会话亦可）。
        时间字段为 UTC 的 ISO 8601 字符串（无时区后缀）。
        错误：401 AUTH_REQUIRED / SESSION_EXPIRED / SESSION_REVOKED；403 ACCOUNT_DISABLED。
      operationId: getAuthSession
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前会话
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSessionPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      description: |
        撤销当前会话（置 revoked_at）并清除会话 Cookie。无请求体。
        错误：401 AUTH_REQUIRED / SESSION_EXPIRED / SESSION_REVOKED；403 ACCOUNT_DISABLED / CSRF_INVALID。
      operationId: authLogout
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: 已退出
          headers:
            Set-Cookie:
              description: 清除 saiflow_session
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [logged_out]
                        properties:
                          logged_out:
                            type: boolean
                            enum: [true]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me:
    get:
      tags: [Me]
      summary: 获取当前用户
      description: |
        返回当前登录用户资料（游客亦可）。
        错误：401 AUTH_REQUIRED / SESSION_EXPIRED / SESSION_REVOKED；403 ACCOUNT_DISABLED。
      operationId: getMe
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Me]
      summary: 更新个人资料
      description: |
        字段白名单：display_name / language / avatar_url，仅更新请求体中出现的字段，其他字段忽略。
        有字段变更时提交并记审计 `me.update`；无变更时原样返回当前用户。

        - display_name：去除首尾空白后长度 1–128。
        - language：th 或 en。
        - avatar_url：游客不可修改（403 PERMISSION_DENIED）。取值规则——与当前头像地址相同视为不变；
          空串清除头像；以 `https://` 开头且不超过 1024 字符时作为外部头像引用保存；
          否则须为 `data:image/(png|jpeg|webp);base64,...` data URL，解码后不超过 300 KB 且文件头与声明类型一致，
          图片转存对象存储，之后 avatar_url 返回 `/api/v1/me/avatar?v=<版本>`。

        错误：
        - 400 INVALID_ARGUMENT，field_errors：display_name→`error.field_required`；language→`error.invalid_argument`；avatar_url→`error.avatar_invalid`
        - 403 PERMISSION_DENIED `error.permission_denied`（游客改头像）；CSRF_INVALID；ACCOUNT_DISABLED
        - 503 STORAGE_UNAVAILABLE `avatar.upload_failed`（头像对象存储失败）
      operationId: updateMe
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /me/quota:
    get:
      tags: [Me]
      summary: 获取工作空间配额
      description: |
        返回当前用户所有有效工作空间（个人空间 + ACTIVE 成员且企业 VERIFIED 的企业空间）的配额视图。
        查询时会幂等补发首登赠送（个人空间）与企业首次认证赠送（企业空间）。
        免费额度按 OCR_TASK（次）计、付费套餐按 OCR_PAGE（页/泰国时间自然月）计，二者分开记账；
        未开通付费套餐时 plan 为 FREE，paid_pages 为 0/0。
        错误：401 AUTH_REQUIRED / SESSION_EXPIRED / SESSION_REVOKED；403 ACCOUNT_DISABLED。
      operationId: getMeQuota
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 配额视图
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [workspaces]
                        properties:
                          workspaces:
                            type: array
                            items:
                              $ref: '#/components/schemas/QuotaWorkspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/avatar:
    get:
      tags: [Me]
      summary: 获取当前用户头像图片
      description: |
        后端代理读取对象存储中的当前用户头像字节（会话鉴权，不生成匿名/签名 URL）。
        响应头 `Cache-Control: private, max-age=86400`、`X-Content-Type-Options: nosniff`；
        Content-Type 按对象扩展名为 image/png、image/jpeg 或 image/webp。
        查询参数 v 仅用于绕过缓存，服务端不读取。
        错误：404 RESOURCE_NOT_FOUND（用户无已转存头像，或对象不存在；外部 https 头像不经此接口）；
        401 AUTH_REQUIRED / SESSION_EXPIRED / SESSION_REVOKED；403 ACCOUNT_DISABLED。
      operationId: getMeAvatar
      security:
        - sessionCookie: []
      parameters:
        - name: v
          in: query
          required: false
          description: 头像版本号（缓存击穿用，服务端忽略）
          schema:
            type: string
      responses:
        '200':
          description: 头像图片字节
          headers:
            Cache-Control:
              schema:
                type: string
                example: "private, max-age=86400"
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/registration:
    post:
      tags: [Me]
      summary: 补录注册信息
      description: |
        LINE 登录后补录注册信息（FR-SYS-014）。仅非游客可调用；手机号只取自 LINE，不可提交。
        依次校验 display_name（去空白后 1–128）、email（≤254 且格式合法）、code（必填，校验并消费
        发往该邮箱且未过期（10 分钟）的最新验证码；AUTH_DEV_MODE 下只要求非空、不校验）。
        可选 avatar_url，规则同 PATCH /me。成功后 registered=true，记审计 `user.register`。

        错误：
        - 400 INVALID_ARGUMENT，field_errors：display_name→`error.field_required`；email→`error.field_required`/`error.email_invalid`；code→`error.field_required`/`error.email_code_invalid`；avatar_url→`error.avatar_invalid`
        - 403 PERMISSION_DENIED `error.permission_denied`（游客）；CSRF_INVALID；ACCOUNT_DISABLED
        - 409 STATE_CONFLICT `registration.already_done`（已完成注册）
        - 503 STORAGE_UNAVAILABLE `avatar.upload_failed`
      operationId: submitMeRegistration
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '200':
          description: 注册完成后的用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /me/email/code:
    post:
      tags: [Me]
      summary: 发送邮箱验证码
      description: |
        向邮箱发送 6 位数字验证码（注册 FR-SYS-014 / 更换邮箱 FR-SYS-016），有效期 10 分钟，
        同一用户发送冷却 60 秒。仅非游客可调用。已注册用户提交与当前邮箱相同（不区分大小写）的邮箱会被拒绝。
        当前实现仅在 AUTH_DEV_MODE 下可用：验证码只写入服务端日志、不实际发信；非开发模式返回 503。
        成功记审计 `me.email_code`。

        错误：
        - 400 INVALID_ARGUMENT，field_errors：email→`error.field_required`/`error.email_invalid`/`error.email_unchanged`
        - 403 PERMISSION_DENIED（游客）；CSRF_INVALID；ACCOUNT_DISABLED
        - 429 RATE_LIMITED `error.rate_limited`（60 秒冷却内重复发送），retryable=true
        - 503 EMAIL_SERVICE_UNAVAILABLE `email.sender_unavailable`（未开启开发模式，发信服务不可用）
      operationId: sendMeEmailCode
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: 目标邮箱（去除首尾空白后校验）
      responses:
        '200':
          description: 验证码已生成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [sent, cooldown_seconds]
                        properties:
                          sent:
                            type: boolean
                            enum: [true]
                          cooldown_seconds:
                            type: integer
                            description: 再次发送前需等待的秒数
                            example: 60
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /me/email:
    post:
      tags: [Me]
      summary: 更换邮箱
      description: |
        凭新邮箱 + 验证码更换邮箱（FR-SYS-016）。仅非游客可调用。新邮箱不得与当前邮箱相同（不区分大小写）。
        code 必填，校验并消费发往该邮箱且未过期的最新验证码；AUTH_DEV_MODE 下只要求非空、不校验。
        成功记审计 `me.email_change`。

        错误：
        - 400 INVALID_ARGUMENT，field_errors：email→`error.field_required`/`error.email_invalid`/`error.email_unchanged`；code→`error.field_required`/`error.email_code_invalid`
        - 403 PERMISSION_DENIED（游客）；CSRF_INVALID；ACCOUNT_DISABLED
      operationId: changeMeEmail
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                code:
                  type: string
                  description: 邮箱验证码（6 位数字）
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/workspaces:
    get:
      tags: [Me]
      summary: 列出我的工作空间
      description: |
