        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /me/email/code:
    post:
      tags: [Me]
      summary: 发送邮箱验证码
      description: |
        向邮箱发送 6 位数字验证码（注册 FR-SYS-014 / 更换邮箱 FR-SYS-016），有效期 10 分钟，
        同一用户发送冷却 60 秒。仅非游客可调用。已注册用户提交与当前邮箱相同（不区分大小写）的邮箱会被拒绝。
        生产使用经证书校验的 TLS SMTP 发信（Gmail 发件账号，应用专用密码由 Secret Manager 注入）。
        仅 SMTP 接受后才记录验证码哈希并使该用户旧码失效；验证码、收件地址及凭据不写日志或响应。
        仅显式本地 AUTH_DEV_MODE 模拟成功、不实际发信。成功记审计 `me.email_code`。

        错误：
        - 400 INVALID_ARGUMENT，field_errors：email→`error.field_required`/`error.email_invalid`/`error.email_unchanged`
        - 403 PERMISSION_DENIED（游客）；CSRF_INVALID；ACCOUNT_DISABLED
        - 429 RATE_LIMITED `error.rate_limited`（60 秒冷却内重复发送），retryable=true
        - 503 EMAIL_SERVICE_UNAVAILABLE `email.sender_unavailable`（未配置、认证失败、拒收、网络或 TLS 错误；不产生有效新码）
      operationId: sendMeEmailCode
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: 目标邮箱（去除首尾空白后校验）
      responses:
        '200':
          description: 验证码邮件已被 SMTP 接受（本地开发模式为模拟）
          content:
