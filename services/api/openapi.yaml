        note 超过 255 字符时被截断（不报错）。新请求状态为 PENDING，记审计 `data_request.create`。

        错误：
        - 400 INVALID_ARGUMENT `error.invalid_argument`（kind 非法，field_errors：kind→`error.invalid_argument`）；`data_request.confirm_required`（confirmed 不为 true）
        - 401 AUTH_REQUIRED / SESSION_EXPIRED / SESSION_REVOKED；403 ACCOUNT_DISABLED / CSRF_INVALID
      operationId: createMeDataRequest
