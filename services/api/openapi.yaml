  /me/subscription:
    get:
      tags: [Plans]
      summary: 获取工作空间订阅状态
      description: |
        返回指定工作空间的套餐订阅状态。订阅按工作空间计：个人空间 = 本人提交且无目标企业的
        PLAN_UPGRADE 申请；企业空间 = 目标为该企业的申请（任一成员提交，全体成员共享）。
        status：ACTIVE=已开通（取已批准申请中的最高档）；PENDING=仅有处理中申请；NONE=未申请。
        can_manage：个人空间恒为 true；企业空间仅 ACTIVE 的 OWNER 为 true。

        错误：
        - 400 INVALID_ARGUMENT `error.invalid_workspace`（workspace_type 非法，或 ENTERPRISE 未给有效 enterprise_id）
        - 403 PERMISSION_DENIED `error.permission_denied`（非该企业成员或企业不存在）；ENTERPRISE_ACCESS_REVOKED `error.enterprise_access_revoked`（成员非 ACTIVE 或企业未 VERIFIED）
        - 401 AUTH_REQUIRED / SESSION_EXPIRED / SESSION_REVOKED；403 ACCOUNT_DISABLED
      operationId: getMeSubscription
      security:
        - sessionCookie: []
      parameters:
        - name: workspace_type
          in: query
          required: false
          description: 工作空间类型（大小写不敏感），默认 PERSONAL
          schema:
            type: string
            enum: [PERSONAL, ENTERPRISE]
            default: PERSONAL
        - name: enterprise_id
          in: query
          required: false
          description: workspace_type=ENTERPRISE 时必填；非整数视为未提供
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 订阅状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/plan-applications:
    post:
      tags: [Plans]
      summary: 提交套餐升级申请
      description: |
        为个人或企业工作空间登记套餐升级意向工单（applications.type=PLAN_UPGRADE，status=SUBMITTED），
        由后台人工审核开通（APPROVED 即视为已购买），无在线支付。游客不可提交。
        企业空间仅该企业 ACTIVE 的 OWNER 可提交。同一工作空间已有处理中申请时拒绝；
        已开通套餐时只能申请更高档位。成功记审计 `plan_application.submit` 并给本人发通知
        PLAN_UPGRADE_SUBMITTED，返回该工作空间最新订阅视图（status 通常为 PENDING 或保持 ACTIVE 且 pending 非空）。

        错误：
        - 400 INVALID_ARGUMENT `error.invalid_argument`（plan_code 不在目录中：field_errors `{field: plan_code, reason: invalid}`；enterprise_id 非整数：`{field: enterprise_id, reason: invalid}`，注意此处 field_errors 使用 reason 而非 message_key）；`error.invalid_workspace`
        - 401 AUTH_REQUIRED `auth.login_required`（游客会话）；SESSION_EXPIRED / SESSION_REVOKED
        - 403 PERMISSION_DENIED `plan.enterprise_owner_only`（非企业 OWNER）/ `error.permission_denied`（非该企业成员）；ENTERPRISE_ACCESS_REVOKED；CSRF_INVALID；ACCOUNT_DISABLED
        - 409 STATE_CONFLICT `plan.application_pending`（已有处理中申请）、`plan.not_upgrade`（不高于已开通档位）
      operationId: submitPlanApplication
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanApplicationRequest'
      responses:
        '201':
          description: 申请已提交，返回最新订阅视图
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  # ===================== Files (routes/files.py) =====================
  /uploads:
    post:
      tags: [Files]
      summary: 创建上传会话
      description: |
        三段式上传第 1 步：POST /uploads（预检并建会话）→ PUT /uploads/{upload_id}/content（原始字节请求体）→ POST /uploads/{upload_id}/complete（校验并置 READY）。
        文件状态机：UPLOADING → UPLOADED → VALIDATING → READY / REJECTED。

        本接口预检工作空间归属、用途、扩展名与声明大小，创建 status=UPLOADING 的文件记录，返回 201。
        - `file_name` 中 `[A-Za-z0-9._-]`、空格、泰文、中日韩统一表意文字以外的字符替换为 `_`，并截断为 255 字符；扩展名（小写）必须为 jpg/jpeg/png/pdf。
        - `size_bytes` 若提供且大于 20MB（20971520）直接拒绝；此时不校验实际字节（实际大小在 PUT content 阶段校验）。
        - 工作空间：`workspace_type` 缺省为 PERSONAL（大小写不敏感）；ENTERPRISE 时 `enterprise_id` 必填，且当前用户须为该企业 ACTIVE 成员、企业状态为 VERIFIED。

        错误：
        - 400 INVALID_ARGUMENT：`error.invalid_argument`（purpose 非法）、`error.invalid_workspace`、`files.unsupported_type`（field_errors 指向 file_name）、`files.too_large`。
        - 403 PERMISSION_DENIED（非该企业成员/企业不存在）、ENTERPRISE_ACCESS_REVOKED（`error.enterprise_access_revoked`，成员非 ACTIVE 或企业未 VERIFIED）、CSRF_INVALID。
      operationId: createUpload
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCreateRequest'
      responses:
        '201':
          description: 已创建上传会话（文件 status=UPLOADING）。`upload_id` 与 `file.id` 相同。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /uploads/{upload_id}/content:
    put:
      tags: [Files]
      summary: 上传文件内容
      description: |
        三段式上传第 2 步：请求体为文件原始字节（不是 multipart，服务端不校验 Content-Type）。
        - 仅上传会话的创建者可调用，否则 404。
        - 文件状态须为 UPLOADING / UPLOADED / REJECTED（允许覆盖重传；REJECTED 后可重传），否则 409 STATE_CONFLICT（`error.state_conflict`）。
        - 字节大于 20MB：文件置 REJECTED，返回 400 `files.too_large`；请求体超过 MAX_CONTENT_LENGTH（20MB）时框架直接返回 400 INVALID_ARGUMENT `files.too_large`。
        - 魔数校验：jpg/jpeg 须为 JPEG（FF D8 FF）、png 须为 PNG 签名、pdf 须以 `%PDF` 开头，且须与会话文件名扩展名一致；否则文件置 REJECTED，返回 400 `files.disguised_type`。
        - 成功后写入对象存储，计算 size_bytes 与 sha256，文件置 UPLOADED 并清空 reject_reason。
      operationId: uploadContent
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: upload_id
          in: path
          required: true
          description: 上传会话 ID（即文件 ID，32 位十六进制 UUID）。
          schema:
            type: string
      requestBody:
        required: true
        description: 文件原始字节（最大 20MB）。
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 内容已接收，文件 status=UPLOADED。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadContentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /uploads/{upload_id}/complete:
    post:
      tags: [Files]
      summary: 完成上传并校验
      description: |
        三段式上传第 3 步：确认上传，置 VALIDATING 后校验完整性与页数，通过则置 READY。
        - 仅上传会话的创建者可调用，否则 404。
        - 已为 READY 时幂等返回 200 与当前文件；状态非 UPLOADED（且非 READY）返回 409 STATE_CONFLICT。
        - PDF 用 pypdf 读取页数，损坏/加密 → 400 `files.corrupt_or_encrypted`；图片页数记为 1。
        - purpose=OCR_TASK 时：PDF 页数 > 50 → 400 `files.too_many_pages`；图片页数 > 1 → 400 `files.invalid`。APPLICATION_MATERIAL 不做页数限制。
        - 以上校验失败时文件置 REJECTED，reject_reason 为对应 message_key。
        Body 无需参数（不读取请求体）。
      operationId: completeUpload
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: upload_id
          in: path
          required: true
          description: 上传会话 ID（即文件 ID，32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '200':
          description: 文件已 READY（含幂等重放）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FilePayload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /file-imports:
    post:
      tags: [Files]
      summary: 通过 URL 导入文件
      description: |
        服务端受控抓取公网文件并直接生成 READY 文件（purpose 固定为 OCR_TASK），返回 201。
        - `url` 必须为 http/https 且含主机名，否则 400 `file_import.invalid_url`。
        - 抓取：连接超时 10s、总超时 20s、跟随重定向；非 200 响应或网络错误 → 400 `file_import.fetch_failed`；累计超过 20MB → 400 `files.too_large`。
        - 类型按魔数判定（JPEG/PNG/PDF），无法识别 → 400 `files.unsupported_type`；文件名取 URL 路径末段（净化并补齐扩展名），缺省为 `import.<ext>`。
        - PDF 损坏/加密 → 400 `files.corrupt_or_encrypted`（文件记录以 REJECTED 落库）。本接口不校验 50 页上限。
        - 工作空间规则同 POST /uploads（`workspace_type` 缺省 PERSONAL；ENTERPRISE 需 `enterprise_id` 与 ACTIVE 成员资格、企业 VERIFIED，否则 400 `error.invalid_workspace` / 403）。
      operationId: importFileFromUrl
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileImportRequest'
      responses:
        '201':
          description: 已导入，文件 status=READY。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FilePayload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /files/{file_id}:
    get:
      tags: [Files]
      summary: 获取文件信息
      description: |
        返回文件元数据。可见范围：本人创建的文件，或 ENTERPRISE 空间文件且当前用户为该企业 ACTIVE 成员；其他情况一律 404（不泄露存在性）。
      operationId: getFile
      security:
        - sessionCookie: []
      parameters:
        - name: file_id
          in: path
          required: true
          description: 文件 ID（32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '200':
          description: 文件信息。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FilePayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /files/{file_id}/content:
    get:
      tags: [Files]
      summary: 读取或下载原件
      description: |
        后端从对象存储取回原件字节并代理下发（需会话鉴权，不提供匿名/签名 URL）。
        - 访问控制同 GET /files/{file_id}。
        - 文件状态须为 READY 或 UPLOADED，且对象存在，否则 404。
        - `download=1` 时以附件下发（Content-Disposition: attachment，文件名为 original_name）；否则内联返回，不带 Content-Disposition。
        - Content-Type 为文件的 mime_type（image/jpeg、image/png、application/pdf）。
      operationId: getFileContent
      security:
        - sessionCookie: []
      parameters:
        - name: file_id
          in: path
          required: true
          description: 文件 ID（32 位十六进制 UUID）。
          schema:
            type: string
        - name: download
          in: query
          required: false
          description: 取值为 `1` 时作为附件下载；其他值或缺省为内联。
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: 原件字节。
          headers:
            Content-Disposition:
              description: 仅 `download=1` 时返回，形如 `attachment; filename=...`（非 ASCII 文件名附带 `filename*=UTF-8''...`）。
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /files/{file_id}/pages/{page}/preview:
    get:
      tags: [Files]
      summary: 获取页预览图
      description: |
        页预览（需会话鉴权，后端代理下发，内联返回无 Content-Disposition）。
        - 访问控制同 GET /files/{file_id}；文件状态须为 READY 或 UPLOADED，否则 404。
        - PDF：用 PyMuPDF 以 2 倍缩放渲染第 `page` 页（1 起）为 PNG，结果缓存于对象存储 `previews/<file_id>/page_<n>.png`；页码越界 → 404；PDF 损坏 → 400 `files.corrupt_or_encrypted`。
        - 图片：仅 `page=1` 有效（否则 404），直接返回原图（Content-Type 为其 mime_type）。
      operationId: getFilePagePreview
      security:
        - sessionCookie: []
      parameters:
        - name: file_id
          in: path
          required: true
          description: 文件 ID（32 位十六进制 UUID）。
          schema:
            type: string
        - name: page
          in: path
          required: true
          description: 页码（1 起）。
          schema:
            type: integer
      responses:
        '200':
          description: 预览图字节。
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===================== OCR (routes/ocr.py) =====================
  /ocr/capabilities:
    get:
      tags: [OCR]
      summary: 获取 OCR 能力与限额
      description: 返回 OCR 厂商（固定 textin）、支持的特性与上传/任务限额（取自服务端配置）。
      operationId: getOcrCapabilities
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 能力与限额。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrCapabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ocr/jobs:
    post:
      tags: [OCR]
      summary: 创建 OCR 任务
      description: |
        基于 READY 且 purpose=OCR_TASK 的文件创建 OCR 任务（status=QUEUED，progress=0），由进程内 worker 异步处理；返回 201 与任务摘要。
        - 任务工作空间由源文件推导（与文件同空间）；ENTERPRISE 文件会再次校验当前用户为企业 ACTIVE 成员且企业 VERIFIED（否则 403 PERMISSION_DENIED / ENTERPRISE_ACCESS_REVOKED）。
        - 文件不可见 → 404；purpose 非 OCR_TASK → 400 `job.file_purpose_invalid`；文件非 READY → 409 STATE_CONFLICT `job.file_not_ready`。
        - 页范围（文件 page_count > 0 时校验）：起始页 = `params.page`(0 起) + 1，超过文件页数 → 400 `job.page_out_of_range`；`params.page_count`（缺省为 min(文件页数, 50)）> 50 → 400 `job.page_count_exceeded`。
        - 幂等：`Idempotency-Key` 请求头优先，body `idempotency_key` 兜底（去首尾空白后 1~128 字符）。命中已有任务且当前用户可见（本人创建或同企业 ACTIVE 成员）→ 200 原样返回该任务摘要；命中但不可见 → 404。
        - 配额：已开通付费套餐的空间按本月剩余页数校验（不消耗免费次数）；否则消耗 1 次免费 OCR 任务。余额不足 → 402 QUOTA_EXCEEDED（`quota.exceeded`）。
        - 仅 `params` 中的 parse_mode/table/formula/rotate/page/page_count/extract_v3 及 `field_names` 会被保存，其他键忽略。
        - 参数非法时 400 INVALID_ARGUMENT，field_errors 形如 `{field: file_id|params|field_names|page|page_count|extract_v3|idempotency_key, reason: required|invalid}`。
      operationId: createOcrJob
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 幂等键（1~128 字符）；优先于 body.idempotency_key。
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcrJobCreateRequest'
      responses:
        '200':
          description: 幂等重放，返回已存在的任务摘要。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrJobSummary'
        '201':
          description: 已创建任务（status=QUEUED）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrJobSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [OCR]
      summary: 分页查询 OCR 任务
      description: |
        列出当前用户可见的任务：本人 PERSONAL 空间任务 + 当前用户为 ACTIVE 成员的所有企业空间任务（含其他成员创建的）。按 created_at 倒序。
        过滤条件可组合：
        - `status`：逗号分隔，大小写不敏感；取值须属于 QUEUED/PREPROCESSING/PROCESSING/POSTPROCESSING/SUCCEEDED/PARTIAL_SUCCESS/FAILED/CANCELLED（CANCEL_REQUESTED 不可作为筛选值），否则 400（field=status）。
        - `workspace_type`：PERSONAL 仅本人个人空间；ENTERPRISE 须同时传 `enterprise_id` 且为 ACTIVE 成员，否则 404；其他值 400（field=workspace_type）。
        - `stage`：OCR_PROCESSING（非终态）/ OCR_FAILED（FAILED、CANCELLED）/ VERIFYING（成功但未确认）/ VERIFIED（已确认但 completed_at 为空）/ COMPLETED（已确认且 completed_at 非空）；非法值 400（field=stage）。
        - `q`：按源文件名（original_name）不区分大小写子串匹配。
        - 分页：`page` ≥ 1，`page_size` 1~100，非法时 400（field=page）。
      operationId: listOcrJobs
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          description: 逗号分隔的任务状态列表，例如 `SUCCEEDED,PARTIAL_SUCCESS`。
          schema:
            type: string
        - name: workspace_type
          in: query
          required: false
          description: 工作空间类型（大小写不敏感）。
          schema:
            type: string
            enum: [PERSONAL, ENTERPRISE]
        - name: enterprise_id
          in: query
          required: false
          description: workspace_type=ENTERPRISE 时必填。
          schema:
            type: integer
        - name: stage
          in: query
          required: false
          description: 流程阶段（大小写不敏感）。
          schema:
            type: string
            enum: [OCR_PROCESSING, OCR_FAILED, VERIFYING, VERIFIED, COMPLETED]
        - name: q
          in: query
          required: false
          description: 文件名关键字。
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 任务分页列表。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrJobPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /ocr/jobs/{job_id}:
    get:
      tags: [OCR]
      summary: 获取 OCR 任务详情
      description: 返回任务摘要（用于轮询状态与进度）。可见范围：本人创建，或企业空间任务且当前用户为该企业 ACTIVE 成员；否则 404。
      operationId: getOcrJob
      security:
        - sessionCookie: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: OCR 任务 ID（32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '200':
          description: 任务摘要。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrJobSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [OCR]
      summary: 删除任务结果
      description: |
        删除任务的全部结果数据：所有 ResultVersion、PageResult 以及关联导出（含对象存储中的导出文件）。任务记录本身保留。
        - 任务须为终态（SUCCEEDED/PARTIAL_SUCCESS/FAILED/CANCELLED），否则 409 STATE_CONFLICT `job.not_terminal`。
        - 可见性同 GET /ocr/jobs/{job_id}，不可见 → 404。
      operationId: deleteOcrJobResults
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: OCR 任务 ID（32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '200':
          description: 结果已删除。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrJobResultsDeleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /ocr/jobs/{job_id}/cancel:
    post:
      tags: [OCR]
      summary: 取消 OCR 任务
      description: |
        - 终态任务 → 409 STATE_CONFLICT `job.already_terminal`。
        - 已为 CANCEL_REQUESTED → 幂等返回当前摘要。
        - QUEUED → 直接置 CANCELLED、写 finished_at，并返还本次消耗的 1 次免费额度（若有）。
        - 处理中（PREPROCESSING/PROCESSING/POSTPROCESSING）→ 置 CANCEL_REQUESTED，由 worker 终止。
        可见性同 GET /ocr/jobs/{job_id}。无请求体。
      operationId: cancelOcrJob
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: OCR 任务 ID（32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '200':
          description: 取消后的任务摘要。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrJobSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /ocr/jobs/{job_id}/rerun:
    post:
      tags: [OCR]
      summary: 重新识别
      description: |
        以原任务的文件、params 与能力快照创建新任务（status=QUEUED，parent_job_id 指向原任务，创建者为当前用户），返回 201。
        - 原任务须为终态，否则 409 `job.not_terminal`；源文件不存在或非 READY → 409 `job.file_not_ready`。
        - 企业空间文件再次校验 ACTIVE 成员资格与企业 VERIFIED（403）。
        - 配额规则同创建任务，不足 → 402 QUOTA_EXCEEDED。
        无请求体。
      operationId: rerunOcrJob
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: OCR 任务 ID（32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '201':
          description: 新任务摘要。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrJobSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ===================== Results (routes/results.py) =====================
  /ocr/jobs/{job_id}/results:
    get:
      tags: [Results]
      summary: 获取当前识别结果
      description: |
        返回任务当前结果版本（is_current=true）。`structured` 为 TextIn Prompt 模式结构化 JSON；旧版逐页结果没有 structured 时折算为 `{fields: {名称: 值}, tables: [[[单元格文本]]]}`。`pages` 为旧版逐页数据（Prompt 任务为空数组）。
        - 尚无结果且任务非终态 → 409 STATE_CONFLICT `results.not_ready`；任务已终态但无结果（如失败或结果已删除）→ 404。
        - 可见性同 GET /ocr/jobs/{job_id}。
      operationId: getOcrJobResults
      security:
        - sessionCookie: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: OCR 任务 ID（32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '200':
          description: 当前结果版本。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ResultVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      tags: [Results]
      summary: 复核编辑或确认结果
      description: |
        乐观并发：`expected_version` 必须等于当前版本号，否则 409 VERSION_CONFLICT（`error.version_conflict`）。
        两种编辑方式（互斥）：
        - `structured`：提交完整结构化 JSON（对象或数组，紧凑 UTF-8 序列化后 ≤ 2,000,000 字节）。与当前内容不同时生成新版本（version+1），并按新 JSON 重算 table_count / field_count；与非空 `edits` 同时提交 → 400（reason=mutually_exclusive_with_structured）。
        - `edits`：旧版逐页结果按单元格修改 current_text（单元格 review_status 置 EDITED，raw_text 保留），生成新版本并复制全部页结果；目标单元格不存在 → 400，field_errors 含 `reason=cell_not_found` 及 page_number/table_id/row_index/column_index。
        `confirm` 为真时：任务 review_status 置 CONFIRMED；已注册（非游客且已完成注册）用户首次确认时写 completed_at（阶段 COMPLETED），否则阶段为 VERIFIED。仅确认且无内容变化时不生成新版本，并将当前版本所有单元格置 CONFIRMED。
        未确认但内容有变化且任务尚未 CONFIRMED 时，review_status 置 EDITED。
        其他错误：结果未就绪 409 `results.not_ready`；无结果 404；参数非法 400（field: expected_version reason=required；edits/edits[i] reason=invalid；structured reason=invalid|too_large）。
      operationId: updateOcrJobResults
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: OCR 任务 ID（32 位十六进制 UUID）。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultUpdateRequest'
      responses:
        '200':
          description: 更新后的当前结果版本（无内容变化时版本号不变）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ResultVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ===================== Exports (routes/exports.py) =====================
  /ocr/jobs/{job_id}/exports:
    post:
      tags: [Exports]
      summary: 创建结果导出
      description: |
        基于任务当前结果版本同步生成导出文件，创建即 READY，返回 201；有效期 24 小时。
        - 格式（大小写不敏感）：XLSX（全部单元格按字符串写入、保留前导零；结构化结果按“文档信息/表格”版式，分区标题语言取用户 language，th 或 en）、CSV（UTF-8 BOM）、TXT（结构化结果为缩进 JSON 文本，旧版为逐页文本）。
        - 以 `=`、`+`、`-`、`@` 开头的单元格文本在 XLSX/CSV 中前置 `'` 防公式注入。
        - 任务非终态 → 409 STATE_CONFLICT `job.not_terminal`；无当前结果版本 → 404；format 非法 → 400（field=format, reason=invalid）。
        - 生成依赖缺失 → 503 EXPORT_UNAVAILABLE（`error.export_unavailable`）；生成/存储失败 → 导出记录置 FAILED，返回 503 EXPORT_FAILED（`error.export_failed`，retryable=true）。
      operationId: createExport
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: OCR 任务 ID（32 位十六进制 UUID）。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportCreateRequest'
      responses:
        '201':
          description: 导出已生成（status=READY）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExportJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /exports/{export_id}:
    get:
      tags: [Exports]
      summary: 查询导出
      description: |
        返回导出记录。对象级鉴权经所属任务校验（不可见 → 404）。
        READY 且已过 expires_at 时，记录被置为 EXPIRED 并返回 409 STATE_CONFLICT `export.expired`；之后再查询返回 200 且 status=EXPIRED。
      operationId: getExport
      security:
        - sessionCookie: []
      parameters:
        - name: export_id
          in: path
          required: true
          description: 导出 ID（32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '200':
          description: 导出记录。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /exports/{export_id}/download:
    get:
      tags: [Exports]
      summary: 下载导出文件
      description: |
        后端代理下发导出文件（需会话 Cookie 与对象级鉴权，无匿名/签名 URL），始终以附件形式返回。
        文件名：`<源文件名去扩展名>-v<result_version_id 前 8 位>.<xlsx|csv|txt>`（源文件缺失时用 job_id）。
        - 不可见 → 404；已过期 → 409 `export.expired`；状态非 READY 或对象不存在 → 409 `export.not_ready`。
      operationId: downloadExport
      security:
        - sessionCookie: []
      parameters:
        - name: export_id
          in: path
          required: true
          description: 导出 ID（32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '200':
          description: 导出文件字节。
          headers:
            Content-Disposition:
              description: 形如 `attachment; filename=...`（非 ASCII 文件名附带 `filename*=UTF-8''...`）。
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /enterprises:
    post:
      tags: [Enterprises]
      summary: 添加公司
      description: |
        创建公司，初始状态为 PENDING_VERIFICATION（待后台人工审核，审核通过后改为 VERIFIED 才生效）。
        系统自动生成公司编号 code（格式 `ent-YYMMDD-xxxxxx`，xxxxxx 为 6 位十六进制随机串），
        创建人自动成为该公司 ACTIVE 状态的 OWNER 成员（approved_via=CREATE）。
        字段先 trim 再校验；请求体非合法 JSON 时按空对象处理。
        校验失败返回 400 INVALID_ARGUMENT，field_errors 可能包含：
        `legal_name/required`（为空或超过 255 字符）、`registration_no/required`（为空或超过 64 字符）、
        `contact_phone/invalid`（超过 32 字符）、`cert_file_id/invalid`（文件不存在、非本人上传、
        purpose 不是 APPLICATION_MATERIAL 或 status 不是 READY）。
        写入审计事件 company.create。
      operationId: createEnterprise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnterpriseUpsertRequest'
      responses:
        '201':
          description: 创建成功，返回新公司（status=PENDING_VERIFICATION）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [enterprise]
                        properties:
                          enterprise:
                            $ref: '#/components/schemas/Enterprise'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - sessionCookie: []
          csrfHeader: []

  /enterprises/mine:
    get:
      tags: [Enterprises]
      summary: 我的公司列表
      description: |
        返回当前用户成员关系状态为 PENDING 或 ACTIVE 的所有公司（自己创建的或已绑定/已申请的，含待审核公司），
        按公司创建时间倒序。每项为公司信息加上我的角色 my_role 与我的成员状态 membership_status。
        不分页。
      operationId: listMyEnterprises
      responses:
        '200':
          description: 我的公司列表。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/MyCompany'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - sessionCookie: []

  /enterprises/{enterprise_id}:
    patch:
      tags: [Enterprises]
      summary: 修改公司信息
      description: |
        仅该公司 ACTIVE 状态的 OWNER 可修改。请求体与添加公司相同，legal_name 与 registration_no
        必须完整提交（整体覆盖 legal_name / registration_no / contact_phone；contact_phone 未提供则置为空串）。
        cert_file_id 为空或未提供时保留原证明材料。
        若公司当前为 VERIFIED，修改后自动回到 PENDING_VERIFICATION 需重新审核；其他状态保持不变。
        公司不存在返回 404 RESOURCE_NOT_FOUND；非 ACTIVE OWNER 返回 403 PERMISSION_DENIED（先于参数校验）；
        参数校验规则与 field_errors 同添加公司。写入审计事件 company.update。
      operationId: updateEnterprise
      parameters:
        - name: enterprise_id
          in: path
          required: true
          description: 公司 ID（enterprises.id）。
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnterpriseUpsertRequest'
      responses:
        '200':
          description: 修改成功，返回最新公司信息。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [enterprise]
                        properties:
                          enterprise:
                            $ref: '#/components/schemas/Enterprise'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - sessionCookie: []
          csrfHeader: []

  /enterprises/bind:
    post:
      tags: [Enterprises]
      summary: 按公司编号绑定公司
      description: |
        按公司编号 code（enterprises.code，如 `ent-261018-a1b2c3`）绑定已生效（VERIFIED）公司，
        绑定后立即成为 ACTIVE 成员（approved_via=BIND）。一人可绑定多个公司；此前已解绑（LEFT）
        可重新绑定，并沿用原角色。服务端仅校验 code 非空（trim 后），不校验格式。
        错误：code 为空返回 400（field_errors `code/required`）；公司不存在或未审核通过统一返回
        404 RESOURCE_NOT_FOUND（不区分）；已是 ACTIVE/PENDING 成员返回 409 STATE_CONFLICT
        `membership.already_member`；成员关系为 REJECTED/REMOVED 返回 409 `membership.rejoin_forbidden`。
        成功后写审计 company.bind，并给本人发送 MEMBERSHIP_ACTIVE 通知。
      operationId: bindEnterprise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnterpriseBindRequest'
      responses:
        '200':
          description: 绑定成功，返回公司信息与我的角色。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EnterpriseJoinResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - sessionCookie: []
          csrfHeader: []

  /enterprises/{enterprise_id}/unbind:
    post:
      tags: [Enterprises]
      summary: 解绑公司
      description: |
        将当前用户在该公司的成员关系（ACTIVE 或 PENDING）置为 LEFT 并记录 revoked_at；
        成员关系记录保留，但不再是有效身份。任何角色（含 OWNER）均可解绑。无需请求体。
        当前用户在该公司无 ACTIVE/PENDING 成员关系时返回 404 RESOURCE_NOT_FOUND。
        写入审计事件 company.unbind。
      operationId: unbindEnterprise
      parameters:
        - name: enterprise_id
          in: path
          required: true
          description: 公司 ID（enterprises.id）。
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 解绑成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EnterpriseUnbindResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - sessionCookie: []
          csrfHeader: []

  /enterprises/{enterprise_id}/membership-applications:
    post:
      tags: [Applications]
      summary: 提交入企申请
      description: |
        向已生效（VERIFIED）公司提交入企申请：创建 type=MEMBERSHIP、status=SUBMITTED 的申请单，
        并为申请人建立 PENDING 成员关系（role=MEMBER，approved_via=APPLICATION）；此前为 LEFT 的成员关系
        改回 PENDING。表单快照 form 记录 message 与公司编号 enterprise_code。
        错误：公司不存在或未 VERIFIED 返回 404 RESOURCE_NOT_FOUND；message 超过 500 字符返回 400
        （field_errors `message/too_long`）；已是 PENDING/ACTIVE 成员返回 409 STATE_CONFLICT
        `application.duplicate_open`；成员关系为 REJECTED/REMOVED 返回 409 `membership.rejoin_forbidden`。
        写入审计事件 application.submit。
      operationId: submitMembershipApplication
      parameters:
        - name: enterprise_id
          in: path
          required: true
          description: 目标公司 ID（enterprises.id）。
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipApplicationRequest'
      responses:
        '201':
          description: 申请已提交，返回申请单。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MembershipApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - sessionCookie: []
          csrfHeader: []

  /enterprises/{enterprise_id}/invitations:
    post:
      tags: [Applications]
      summary: 创建邀请
      description: |
        仅该公司 ACTIVE 状态的 OWNER 或 ADMIN 可创建一次性邀请令牌。令牌明文只在本响应中返回一次，
        服务端仅保存其 SHA-256 哈希。创建时不校验公司审核状态（兑换时才要求 VERIFIED）。
        错误：公司不存在返回 404 RESOURCE_NOT_FOUND；非 ACTIVE OWNER/ADMIN 返回 403 PERMISSION_DENIED；
        max_uses 非 1–100 的整数返回 400（field_errors `max_uses/invalid`）；ttl_hours 非 1–720 的整数返回 400
        （field_errors `ttl_hours/invalid`）。布尔值、浮点数、字符串或显式 null 均视为非法。
        写入审计事件 invitation.create。
      operationId: createInvitation
      parameters:
        - name: enterprise_id
          in: path
          required: true
          description: 公司 ID（enterprises.id）。
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreateRequest'
      responses:
        '201':
          description: 邀请已创建，返回令牌明文（仅此一次）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - sessionCookie: []
          csrfHeader: []

  /invitations/redeem:
    post:
      tags: [Applications]
      summary: 兑换邀请
      description: |
        已登录用户凭邀请令牌加入公司，成功后成为 ACTIVE 成员（approved_via=INVITATION；此前为 LEFT 则恢复并沿用原角色），
        邀请 use_count 加 1，达到 max_uses 时邀请置为 EXPIRED。令牌会先 trim 再计算哈希匹配。
        错误：token 缺失、非字符串或超过 128 字符返回 400（field_errors `token/required`）；
        令牌不存在或邀请非 ACTIVE 统一返回 404 RESOURCE_NOT_FOUND（防枚举）；
        409 STATE_CONFLICT 的 message_key：`invitation.expired`（已过期，同时置为 EXPIRED）、
        `invitation.exhausted`（次数用尽）、`invitation.enterprise_unavailable`（公司不存在或未 VERIFIED）、
        `membership.already_member`（已是 ACTIVE/PENDING 成员）、`membership.rejoin_forbidden`（成员关系为 REJECTED/REMOVED）。
        成功后写审计 invitation.redeem，并给本人发送 MEMBERSHIP_ACTIVE 通知。
      operationId: redeemInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRedeemRequest'
      responses:
        '200':
          description: 兑换成功，返回公司信息与我的角色。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EnterpriseJoinResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - sessionCookie: []
          csrfHeader: []

  /invitations/{invitation_id}:
    delete:
      tags: [Applications]
      summary: 撤销邀请
      description: |
        将 ACTIVE 邀请置为 REVOKED。邀请创建人或该公司 OWNER/ADMIN 可撤销。
        错误：邀请不存在返回 404 RESOURCE_NOT_FOUND；无权限返回 403 PERMISSION_DENIED；
        邀请已非 ACTIVE（已撤销/已过期）返回 409 STATE_CONFLICT `invitation.not_active`。
        写入审计事件 invitation.revoke。
      operationId: revokeInvitation
      parameters:
        - name: invitation_id
          in: path
          required: true
          description: 邀请 ID（invitations.id）。
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 撤销成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/InvitationRevokeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - sessionCookie: []
          csrfHeader: []

  /health:
    get:
      tags: [Ops]
      summary: 健康检查
      description: 非版本化运维端点，实际路径为 `/api/health`，无需登录。`vendor` 表示 TextIn 客户端是否已配置。
      operationId: getHealth
      security: []
      servers:
        - url: /api
      responses:
        '200':
          description: 服务存活
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, vendor]
                properties:
                  ok:
                    type: boolean
                    example: true
                  service:
                    type: string
                    example: saiflow-api
                  vendor:
                    type: string
                    enum: [textin, unconfigured]
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: saiflow_session
      description: 登录 / 游客会话 Cookie（HttpOnly，path=/api），由 `POST /auth/line` 或 `POST /auth/guest` 下发。
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 写请求（POST/PUT/PATCH/DELETE）必带；值为登录或 `GET /auth/session` 返回的 `csrf_token`。
  responses:
    BadRequest:
      description: 参数校验失败（INVALID_ARGUMENT）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_ARGUMENT
            message_key: error.invalid_argument
            request_id: 3f9c2a1b7d4e5f60
            retryable: false
            field_errors:
              - field: legal_name
                reason: required
    Unauthorized:
      description: 未登录或会话无效（AUTH_REQUIRED / SESSION_EXPIRED / SESSION_REVOKED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_REQUIRED
            message_key: auth.login_required
            request_id: 3f9c2a1b7d4e5f60
            retryable: false
            field_errors: []
    PaymentRequired:
      description: 免费 OCR 任务额度不足（QUOTA_EXCEEDED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: QUOTA_EXCEEDED
            message_key: quota.exceeded
            request_id: 3f9c2a1b7d4e5f60
            retryable: false
            field_errors: []
    Forbidden:
      description: 无权限（ACCOUNT_DISABLED / PERMISSION_DENIED / CSRF_INVALID / ENTERPRISE_ACCESS_REVOKED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: CSRF_INVALID
            message_key: error.csrf_invalid
            request_id: 3f9c2a1b7d4e5f60
            retryable: false
            field_errors: []
    NotFound:
      description: 资源不存在或无权访问（RESOURCE_NOT_FOUND）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESOURCE_NOT_FOUND
            message_key: error.not_found
            request_id: 3f9c2a1b7d4e5f60
            retryable: false
            field_errors: []
    Conflict:
      description: 状态冲突（STATE_CONFLICT / VERSION_CONFLICT）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: STATE_CONFLICT
            message_key: error.state_conflict
            request_id: 3f9c2a1b7d4e5f60
            retryable: false
            field_errors: []
    TooManyRequests:
      description: 请求过于频繁（RATE_LIMITED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMITED
            message_key: error.rate_limited
            request_id: 3f9c2a1b7d4e5f60
            retryable: true
            field_errors: []
    ServiceUnavailable:
      description: 依赖服务不可用（SERVICE_UNAVAILABLE / AUTH_SERVICE_UNAVAILABLE / OCR_VENDOR_UNAVAILABLE / EMAIL_SERVICE_UNAVAILABLE / STORAGE_UNAVAILABLE / EXPORT_UNAVAILABLE / EXPORT_FAILED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SERVICE_UNAVAILABLE
            message_key: error.service_unavailable
            request_id: 3f9c2a1b7d4e5f60
            retryable: true
            field_errors: []
  schemas:
    OkEnvelope:
      type: object
      description: 成功响应外层；各接口用 allOf 收窄 `data` 的结构。
      required: [code, data]
      properties:
        code:
          type: string
          enum: [OK]
        data:
          description: 业务数据（无返回内容时为空对象）
    Error:
      type: object
      description: 统一错误响应。
      required: [code, message_key, request_id, retryable, field_errors]
      properties:
        code:
          type: string
          description: 机器可读错误码
          enum:
            - INVALID_ARGUMENT
            - AUTH_REQUIRED
            - SESSION_EXPIRED
            - SESSION_REVOKED
            - QUOTA_EXCEEDED
            - ACCOUNT_DISABLED
            - PERMISSION_DENIED
            - CSRF_INVALID
            - ENTERPRISE_ACCESS_REVOKED
            - RESOURCE_NOT_FOUND
            - STATE_CONFLICT
            - VERSION_CONFLICT
            - RATE_LIMITED
            - SERVICE_UNAVAILABLE
            - AUTH_SERVICE_UNAVAILABLE
            - OCR_VENDOR_UNAVAILABLE
            - EMAIL_SERVICE_UNAVAILABLE
            - STORAGE_UNAVAILABLE
            - EXPORT_UNAVAILABLE
            - EXPORT_FAILED
        message_key:
          type: string
          description: 前端 i18n 文案键
          example: error.not_found
        request_id:
          type: string
          description: 请求追踪 ID（16 位十六进制）
        retryable:
          type: boolean
          description: 是否可重试
        field_errors:
          type: array
          description: 字段级校验错误（仅 INVALID_ARGUMENT 时可能非空）
          items:
            type: object
            required: [field, reason]
            properties:
              field:
                type: string
                example: legal_name
              reason:
                type: string
                description: 原因代码，如 required / invalid / too_long
                example: required

    AuthLineRequest:
      type: object
      description: id_token 与 dev_id 至少提供其一；dev_id 仅在 AUTH_DEV_MODE 开启且 id_token 为空时生效
      properties:
        id_token:
          type: string
          description: LINE LIFF/Login 获取的 ID token（去除首尾空白）
        dev_id:
          type: string
          maxLength: 64
          description: 开发兜底身份标识（仅 AUTH_DEV_MODE），映射为 line_sub=dev:<dev_id>
        language:
          type: string
          enum: [th, en]
          description: 界面语言；非 th/en 时忽略

    User:
      type: object
      required: [id, display_name, avatar_url, language, status, is_guest, phone, email, registered, created_at]
      properties:
        id:
          type: integer
          format: int64
        display_name:
          type: string
          maxLength: 128
        avatar_url:
          type: string
          description: 头像地址；已转存时为 `/api/v1/me/avatar?v=<版本>`，否则为外部 https URL（LINE），无头像为空串
        language:
          type: string
          enum: [th, en]
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        is_guest:
          type: boolean
          description: 是否游客账号
        phone:
          type: string
          maxLength: 32
          description: 来自 LINE，用户不可修改；可能为空串
        email:
          type: string
          maxLength: 254
          description: 可能为空串
        registered:
          type: boolean
          description: 是否已完成注册信息录入
        created_at:
          type: string
          format: date-time
          nullable: true
          description: UTC ISO 8601（无时区后缀）

    Workspace:
      type: object
      required: [workspace_type, enterprise_id, enterprise_name, role]
      properties:
        workspace_type:
          type: string
          enum: [PERSONAL, ENTERPRISE]
        enterprise_id:
          type: integer
          format: int64
          nullable: true
          description: 个人空间为 null
        enterprise_name:
          type: string
          nullable: true
          description: 企业法定名称；个人空间为 null
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
          nullable: true
          description: 本人在企业中的角色；个人空间为 null

    AuthPayload:
      type: object
      required: [user, csrf_token, workspaces]
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
          description: 明文 CSRF token，写请求需放入 X-CSRF-Token 请求头
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'

    AuthSessionPayload:
      allOf:
        - $ref: '#/components/schemas/AuthPayload'
        - type: object
          required: [issued_at, absolute_expires_at]
          properties:
            issued_at:
              type: string
              format: date-time
              nullable: true
              description: 会话签发时间（UTC，无时区后缀）
            absolute_expires_at:
              type: string
              format: date-time
              nullable: true
              description: 会话绝对过期时间（UTC，无时区后缀）

    UpdateMeRequest:
      type: object
      description: 仅出现的字段会被更新
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
          description: 去除首尾空白后校验
        language:
          type: string
          enum: [th, en]
        avatar_url:
          type: string
          description: |
            与当前头像地址相同=不变；空串=清除；https URL（≤1024 字符）=外部引用；
            或 data URL `data:image/(png|jpeg|webp);base64,...`（解码后 ≤300 KB，文件头须与类型一致）。游客不可修改。

    RegistrationRequest:
      type: object
      required: [display_name, email, code]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          description: 邮箱验证码（AUTH_DEV_MODE 下仅要求非空）
        avatar_url:
          type: string
          description: 可选，规则同 UpdateMeRequest.avatar_url

    QuotaWorkspace:
      type: object
      required: [workspace_type, enterprise_id, enterprise_name, plan, free_tasks, paid_pages]
      properties:
        workspace_type:
          type: string
          enum: [PERSONAL, ENTERPRISE]
        enterprise_id:
          type: integer
          format: int64
          nullable: true
        enterprise_name:
          type: string
          nullable: true
        plan:
          type: object
          required: [code, name, is_paid, free_unit, paid_unit]
          properties:
            code:
              type: string
              enum: [FREE, KINDER, STARTER, INTERMEDIATE, ADVANCE]
            name:
              type: string
            is_paid:
              type: boolean
            free_unit:
              type: string
              enum: [OCR_TASK]
            paid_unit:
              type: string
              enum: [OCR_PAGE]
        free_tasks:
          type: object
          required: [total, remaining]
          description: 免费额度（次）
          properties:
            total:
              type: integer
              description: 累计赠送总次数
            remaining:
              type: integer
              minimum: 0
              description: 剩余次数（不小于 0）
        paid_pages:
          type: object
          required: [monthly_total, remaining]
          description: 付费套餐本月页数（泰国时间自然月）；未开通时均为 0
          properties:
            monthly_total:
              type: integer
            remaining:
              type: integer
              minimum: 0

    PendingApplicationBrief:
      type: object
      required: [id, type, status]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [ENTERPRISE_VERIFICATION, MEMBERSHIP, PLAN_UPGRADE]
        status:
          type: string
          enum: [DRAFT, SUBMITTED, UNDER_REVIEW, NEEDS_INFO]

    UserApplication:
      type: object
      required: [id, type, status, form, version, review_note, target_enterprise_id, submitted_at, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [ENTERPRISE_VERIFICATION, MEMBERSHIP, PLAN_UPGRADE]
        status:
          type: string
          enum: [DRAFT, SUBMITTED, UNDER_REVIEW, NEEDS_INFO, APPROVED, REJECTED, WITHDRAWN]
        form:
          type: object
          additionalProperties: true
          description: 表单快照（结构随 type 而异；PLAN_UPGRADE 含 plan_code/plan_name/workspace_type/enterprise_id）
        version:
          type: integer
          description: 乐观并发版本号
        review_note:
          type: string
          maxLength: 512
        target_enterprise_id:
          type: integer
          format: int64
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    Notification:
      type: object
      required: [id, type, title, body, read, created_at]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          maxLength: 32
          description: 通知类型，如 INFO、PLAN_UPGRADE_SUBMITTED
        title:
          type: string
          maxLength: 128
        body:
          type: string
          maxLength: 512
        read:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true

    ActivityEvent:
      type: object
      required: [action, object_type, object_id, created_at]
      properties:
        action:
          type: string
          maxLength: 64
          description: 审计动作，如 me.update、user.register、plan_application.submit
        object_type:
          type: string
          maxLength: 32
        object_id:
          type: string
          maxLength: 64
        created_at:
          type: string
          format: date-time
          nullable: true

    DataRequest:
      type: object
      required: [id, kind, status, created_at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [ACCESS, DELETION]
        status:
          type: string
          enum: [PENDING, DONE, REJECTED]
        created_at:
          type: string
          format: date-time
          nullable: true

    Plan:
      type: object
      required: [code, name, price, quota_pages_per_month, seats, features]
      properties:
        code:
          type: string
          enum: [KINDER, STARTER, INTERMEDIATE, ADVANCE]
        name:
          type: string
        price:
          type: object
          required: [monthly_thb, yearly_thb, display]
          properties:
            monthly_thb:
              type: integer
              nullable: true
              description: 月付价格（THB）；不提供时为 null
            yearly_thb:
              type: integer
              nullable: true
              description: 年付价格（THB）；不提供时为 null
            display:
              type: string
              description: 展示文案，如 "THB 888 / year"、"Contact us"
        quota_pages_per_month:
          type: integer
          description: 每月可识别页数
        seats:
          type: integer
        features:
          type: array
          items:
            type: string

    SubscriptionBrief:
      type: object
      required: [plan_code, plan_name, application_id, submitted_at]
      properties:
        plan_code:
          type: string
          nullable: true
          enum: [KINDER, STARTER, INTERMEDIATE, ADVANCE, null]
        plan_name:
          type: string
          nullable: true
        application_id:
          type: integer
          format: int64
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true

    Subscription:
      allOf:
        - $ref: '#/components/schemas/SubscriptionBrief'
        - type: object
          description: 顶层 plan_code/plan_name/application_id/submitted_at 取自生效申请（ACTIVE）或处理中申请（PENDING）；NONE 时均为 null
          required: [status, pending, workspace_type, enterprise_id, can_manage]
          properties:
            status:
              type: string
              enum: [ACTIVE, PENDING, NONE]
            pending:
              allOf:
                - $ref: '#/components/schemas/SubscriptionBrief'
              nullable: true
              description: 处理中的申请（SUBMITTED/UNDER_REVIEW/NEEDS_INFO）；无则 null
            workspace_type:
              type: string
              enum: [PERSONAL, ENTERPRISE]
            enterprise_id:
              type: integer
              format: int64
              nullable: true
            can_manage:
              type: boolean
              description: 当前用户能否为该空间申请套餐（个人空间 true；企业空间仅 OWNER）

    PlanApplicationRequest:
      type: object
      required: [plan_code]
      properties:
        plan_code:
          type: string
          enum: [KINDER, STARTER, INTERMEDIATE, ADVANCE]
        workspace_type:
          type: string
          enum: [PERSONAL, ENTERPRISE]
          default: PERSONAL
          description: 大小写不敏感，默认 PERSONAL
        enterprise_id:
          type: integer
          format: int64
          nullable: true
          description: workspace_type=ENTERPRISE 时必填；必须为 JSON 整数（布尔/字符串均拒绝）

    # ---------- Files ----------
    FileObject:
      type: object
      description: 文件对象（File.to_dict）。时间为 UTC ISO 8601，无时区后缀。
      properties:
        id:
          type: string
          description: 文件 ID（32 位十六进制）。
          example: 3f2b9c0e8a1d4e6f9b7c5a3d2e1f0a9b
        workspace_type:
          type: string
          enum: [PERSONAL, ENTERPRISE]
        enterprise_id:
          type: integer
          nullable: true
        purpose:
          type: string
          enum: [OCR_TASK, APPLICATION_MATERIAL]
        original_name:
          type: string
          maxLength: 255
          description: 净化后的原始文件名。
        mime_type:
          type: string
          description: image/jpeg、image/png、application/pdf；扩展名不受支持时为空串。
        size_bytes:
          type: integer
          description: 字节数（内容上传前为 0）。
        page_count:
          type: integer
          description: 页数（complete 校验前为 0；图片为 1）。
        sha256:
          type: string
          description: 内容 SHA-256 十六进制摘要（内容上传前为空串）。
        status:
          type: string
          enum: [UPLOADING, UPLOADED, VALIDATING, READY, REJECTED]
        reject_reason:
          type: string
          description: 拒绝原因 message_key（如 files.too_large、files.disguised_type、files.too_many_pages、files.invalid、files.corrupt_or_encrypted）；未拒绝为空串。
        created_at:
          type: string
          nullable: true
          example: '2026-10-18T03:21:45.123456'
    FilePayload:
      type: object
      properties:
        file:
          $ref: '#/components/schemas/FileObject'
    UploadCreateRequest:
      type: object
      required: [file_name]
      properties:
        file_name:
          type: string
          description: 原始文件名；扩展名须为 jpg/jpeg/png/pdf（大小写不敏感），净化后截断至 255 字符。
          example: invoice-2026-10.pdf
        size_bytes:
          type: integer
          maximum: 20971520
          description: 可选，声明的文件大小；超过 20MB 直接拒绝。
        purpose:
          type: string
          enum: [OCR_TASK, APPLICATION_MATERIAL]
          default: OCR_TASK
        workspace_type:
          type: string
          enum: [PERSONAL, ENTERPRISE]
          default: PERSONAL
          description: 大小写不敏感。
        enterprise_id:
          type: integer
          description: workspace_type=ENTERPRISE 时必填。
    UploadSession:
      type: object
      properties:
        upload_id:
          type: string
          description: 上传会话 ID，与 file.id 相同；用于后续 PUT content / POST complete。
        file:
          $ref: '#/components/schemas/FileObject'
    UploadContentResult:
      type: object
      properties:
        file_id:
          type: string
        size_bytes:
          type: integer
        sha256:
          type: string
    FileImportRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: http 或 https 公网地址。
          example: https://example.com/docs/po-001.pdf
        workspace_type:
          type: string
          enum: [PERSONAL, ENTERPRISE]
          default: PERSONAL
          description: 大小写不敏感。
        enterprise_id:
          type: integer
          description: workspace_type=ENTERPRISE 时必填。

    # ---------- OCR ----------
    OcrCapabilities:
      type: object
      properties:
        vendor:
          type: string
          enum: [textin]
        features:
          type: object
          properties:
            table:
              type: boolean
              example: true
            formula:
              type: boolean
              example: true
            rotate:
              type: boolean
              example: true
            fields:
              type: boolean
              example: true
            parse_modes:
              type: array
              items:
                type: string
              example: [scan, layout, article]
        limits:
          type: object
          properties:
            allowed_extensions:
              type: array
              items:
                type: string
              example: [jpeg, jpg, pdf, png]
            max_file_size_bytes:
              type: integer
              example: 20971520
            max_pages_per_task:
              type: integer
              example: 50
            max_images_per_task:
              type: integer
              example: 10
            max_images_total_bytes:
              type: integer
              example: 52428800
    OcrJobParams:
      type: object
      description: OCR 参数。仅以下键会被保存；parse_mode/table/formula/rotate 服务端不校验取值，原样保存。
      properties:
        parse_mode:
          type: string
          description: 解析模式，能力接口给出 scan / layout / article。
        table:
          type: boolean
        formula:
          type: boolean
        rotate:
          type: boolean
        page:
          type: integer
          minimum: 0
          description: 起始页偏移（0 起；实际起始页 = page + 1）。
        page_count:
          type: integer
          minimum: 1
          maximum: 50
          description: 识别页数；缺省为 min(文件页数, 50)。
        extract_v3:
          type: boolean
          description: >-
            任务级灰度覆盖。true 走 TextIn extract-v3 智能抽取，false 走 Prompt 模式；
            缺省时取全局开关 EXTRACT_V3_ENABLED。extract-v3 失败自动回退 Prompt 模式，
            实际路径回写 ocr_jobs.capability.extractor。
    OcrJobCreateRequest:
      type: object
      required: [file_id]
      properties:
        file_id:
          type: string
          description: READY 且 purpose=OCR_TASK 的文件 ID。
        params:
          $ref: '#/components/schemas/OcrJobParams'
        field_names:
          type: array
          maxItems: 100
          description: 需抽取的字段名列表；每项为非空白字符串且长度 ≤ 64，保存前去首尾空白。
          items:
            type: string
            minLength: 1
            maxLength: 64
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          description: 幂等键（Idempotency-Key 请求头缺省时使用）。
    OcrJobSummary:
      type: object
      description: OCR 任务摘要（OcrJob.to_summary）。时间为 UTC ISO 8601，无时区后缀。
      properties:
        id:
          type: string
        workspace_type:
          type: string
          enum: [PERSONAL, ENTERPRISE]
        enterprise_id:
          type: integer
          nullable: true
        file_id:
          type: string
        file_name:
          type: string
          description: 源文件 original_name（文件缺失时为空串）。
        status:
          type: string
          enum: [QUEUED, PREPROCESSING, PROCESSING, POSTPROCESSING, SUCCEEDED, PARTIAL_SUCCESS, FAILED, CANCEL_REQUESTED, CANCELLED]
        progress:
          type: integer
          description: 进度（0~100）。
        page_count:
          type: integer
        table_count:
          type: integer
        field_count:
          type: integer
        duration_ms:
          type: integer
        review_status:
          type: string
          enum: [UNREVIEWED, EDITED, CONFIRMED]
        stage:
          type: string
          enum: [OCR_PROCESSING, OCR_FAILED, VERIFYING, VERIFIED, COMPLETED]
          description: |
            流程阶段：FAILED/CANCELLED → OCR_FAILED；其余非成功状态 → OCR_PROCESSING；成功（SUCCEEDED/PARTIAL_SUCCESS）未确认 → VERIFYING；已确认且 completed_at 为空（游客/未注册用户确认）→ VERIFIED；已确认且 completed_at 非空 → COMPLETED。
        error_code:
          type: string
          description: 失败时的错误码，否则为空串。
        error_message:
          type: string
        parent_job_id:
          type: string
          nullable: true
          description: 由 rerun 产生时指向原任务。
        created_at:
          type: string
          nullable: true
        finished_at:
          type: string
          nullable: true
    OcrJobPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OcrJobSummary'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    OcrJobResultsDeleted:
      type: object
      properties:
        id:
          type: string
          description: 任务 ID。
        results_deleted:
          type: boolean
          enum: [true]

    # ---------- Results ----------
    ResultCell:
      type: object
      description: 旧版逐页结果的表格单元格。
      properties:
        row_index:
          type: integer
          minimum: 0
        column_index:
          type: integer
          minimum: 0
        row_span:
          type: integer
        column_span:
          type: integer
        raw_text:
          type: string
          description: OCR 原始文本（编辑后保留）。
        current_text:
          type: string
          description: 当前文本（可编辑）。
        polygon:
          type: array
          items: {}
          description: 厂商返回的坐标。
        confidence:
          type: number
        review_status:
          type: string
          enum: [UNREVIEWED, EDITED, CONFIRMED]
    ResultTable:
      type: object
      properties:
        table_id:
          type: string
          example: table_1
        row_count:
          type: integer
        column_count:
          type: integer
        cells:
          type: array
          items:
            $ref: '#/components/schemas/ResultCell'
    ResultField:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        source:
          type: string
        source_page:
          type: integer
    ResultPage:
      type: object
      description: 旧版逐页结果。
      properties:
        page_number:
          type: integer
          description: 原始页码（1 起）。
        text:
          type: string
        tables:
          type: array
          items:
            $ref: '#/components/schemas/ResultTable'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ResultField'
    ResultVersion:
      type: object
      description: 任务当前结果版本视图。
      properties:
        job_id:
          type: string
        version:
          type: integer
          description: 当前版本号（每次内容修改 +1），PATCH 时作为 expected_version。
        review_status:
          type: string
          enum: [UNREVIEWED, EDITED, CONFIRMED]
        page_count:
          type: integer
        table_count:
          type: integer
        field_count:
          type: integer
        missing_pages:
          type: array
          description: PARTIAL_SUCCESS 时缺失的页码。
          items:
            type: integer
        structured:
          description: |
            结构化结果（任意 JSON 对象或数组，保留键顺序）。TextIn Prompt 任务为结构化 JSON；旧版逐页结果折算为 `{fields: {名称: 值}, tables: [[[单元格文本]]]}`。
        pages:
          type: array
          description: 旧版逐页数据；TextIn Prompt 任务为空数组。
          items:
            $ref: '#/components/schemas/ResultPage'
    ResultCellEdit:
      type: object
      required: [page_number, table_id, row_index, column_index, current_text]
      properties:
        page_number:
          type: integer
          minimum: 1
        table_id:
          type: string
          minLength: 1
        row_index:
          type: integer
          minimum: 0
        column_index:
          type: integer
          minimum: 0
        current_text:
          type: string
          maxLength: 4000
    ResultUpdateRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          description: 客户端所见的当前版本号（须为整数，不接受布尔值）。
        structured:
          description: 完整结构化 JSON（对象或数组，紧凑序列化后 ≤ 2,000,000 字节）；与非空 edits 互斥。
        edits:
          type: array
          description: 旧版逐页结果的单元格编辑；与 structured 互斥。
          items:
            $ref: '#/components/schemas/ResultCellEdit'
        confirm:
          type: boolean
          default: false
          description: 为真时确认结果（review_status=CONFIRMED）。

    # ---------- Exports ----------
    ExportCreateRequest:
      type: object
      required: [format]
      properties:
        format:
          type: string
          enum: [XLSX, CSV, TXT]
          description: 大小写不敏感。
    ExportJob:
      type: object
      description: 导出记录（Export.to_dict）。时间为 UTC ISO 8601，无时区后缀。
      properties:
        id:
          type: string
        job_id:
          type: string
        result_version_id:
          type: string
          description: 导出所基于的结果版本 ID。
        format:
          type: string
          enum: [XLSX, CSV, TXT]
        status:
          type: string
          enum: [GENERATING, READY, EXPIRED, FAILED]
        expires_at:
          type: string
          nullable: true
          description: 过期时间（创建后 24 小时）。
        created_at:
          type: string
          nullable: true

    EnterpriseStatus:
      type: string
      description: 公司审核状态。PENDING_VERIFICATION=待审核；VERIFIED=已生效；SUSPENDED=已暂停；DISABLED=审核不通过/停用。
      enum: [PENDING_VERIFICATION, VERIFIED, SUSPENDED, DISABLED]

    MembershipRole:
      type: string
      description: 成员角色。
      enum: [OWNER, ADMIN, MEMBER]

    Enterprise:
      type: object
      description: 公司（enterprises 表，Enterprise.to_dict()）。
      required: [id, code, country, legal_name, registration_no, contact_phone, cert_file_id, status]
      properties:
        id:
          type: integer
          format: int64
          description: 公司 ID（自增）。
        code:
          type: string
          maxLength: 32
          description: 公司编号（系统生成，格式 `ent-YYMMDD-xxxxxx`），用于按编号绑定。
          example: ent-261018-a1b2c3
        country:
          type: string
          maxLength: 8
          description: 国家代码，默认 TH。
          example: TH
        legal_name:
          type: string
          maxLength: 255
          description: 公司名称。
        registration_no:
          type: string
          maxLength: 64
          description: 公司代码（注册号）。
        contact_phone:
          type: string
          maxLength: 32
          description: 联系人手机号，可为空串。
        cert_file_id:
          type: string
          nullable: true
          maxLength: 36
          description: 证明材料文件 ID（files.id，purpose=APPLICATION_MATERIAL）；未上传为 null。
        status:
          $ref: '#/components/schemas/EnterpriseStatus'

    MyCompany:
      description: 我的公司列表项：公司信息 + 我的角色与成员状态。
      allOf:
        - $ref: '#/components/schemas/Enterprise'
        - type: object
          required: [my_role, membership_status]
          properties:
            my_role:
              $ref: '#/components/schemas/MembershipRole'
            membership_status:
              type: string
              description: 我在该公司的成员状态（列表只包含 PENDING 与 ACTIVE）。
              enum: [PENDING, ACTIVE]

    EnterpriseUpsertRequest:
      type: object
      description: 添加/修改公司请求体。所有字符串字段会先 trim 再校验。
      required: [legal_name, registration_no]
      properties:
        legal_name:
          type: string
          minLength: 1
          maxLength: 255
          description: 公司名称（必填）。
        registration_no:
          type: string
          minLength: 1
          maxLength: 64
          description: 公司代码/注册号（必填）。
        contact_phone:
          type: string
          maxLength: 32
          description: 联系人手机号（可选，未提供为空串）。
        cert_file_id:
          type: string
          nullable: true
          description: 证明材料文件 ID；须为本人上传、purpose=APPLICATION_MATERIAL 且 status=READY 的文件。可选；修改时为空则保留原值。

    EnterpriseBindRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          description: 公司编号（enterprises.code，trim 后非空；服务端不校验格式）。
          example: ent-261018-a1b2c3

    EnterpriseJoinResult:
      type: object
      description: 绑定或兑换邀请成功后的结果。
      required: [enterprise, role]
      properties:
        enterprise:
          $ref: '#/components/schemas/Enterprise'
        role:
          $ref: '#/components/schemas/MembershipRole'

    EnterpriseUnbindResult:
      type: object
      required: [enterprise_id, status]
      properties:
        enterprise_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [LEFT]

    MembershipApplicationRequest:
      type: object
      properties:
        message:
          type: string
          maxLength: 500
          description: 申请留言（可选，trim 后不超过 500 字符）。

    MembershipApplication:
      type: object
      description: 入企申请单（applications 表，Application.to_dict()）。时间为 UTC，ISO 8601 无时区后缀。
      required: [id, type, status, form, version, review_note, target_enterprise_id, submitted_at, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          description: 申请类型，本接口固定为 MEMBERSHIP。
          enum: [MEMBERSHIP]
        status:
          type: string
          description: 申请状态；新提交为 SUBMITTED。
          enum: [DRAFT, SUBMITTED, UNDER_REVIEW, NEEDS_INFO, APPROVED, REJECTED, WITHDRAWN]
        form:
          type: object
          description: 表单快照。
          properties:
            message:
              type: string
              description: 申请留言（可为空串）。
            enterprise_code:
              type: string
              description: 目标公司编号。
        version:
          type: integer
          description: 乐观并发版本号，新建为 1。
        review_note:
          type: string
          maxLength: 512
          description: 审核备注，新建为空串。
        target_enterprise_id:
          type: integer
          format: int64
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    InvitationCreateRequest:
      type: object
      properties:
        max_uses:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
          description: 最大可兑换次数。
        ttl_hours:
          type: integer
          minimum: 1
          maximum: 720
          default: 72
          description: 有效期（小时），最长 30 天。

    Invitation:
      type: object
      description: 创建邀请的返回结果；token 明文仅在此返回一次。
      required: [id, token, url, expires_at, max_uses]
      properties:
        id:
          type: integer
          format: int64
          description: 邀请 ID。
        token:
          type: string
          description: 邀请令牌明文（URL-safe，32 字符左右）。
        url:
          type: string
          nullable: true
          description: 加入链接 `{APP_BASE_URL}/join?token=...`；未配置 APP_BASE_URL 时为 null。
        expires_at:
          type: string
          format: date-time
          description: 过期时间（UTC，ISO 8601 无时区后缀）。
        max_uses:
          type: integer
          description: 最大可兑换次数。

    InvitationRedeemRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: 邀请令牌明文。

    InvitationRevokeResult:
      type: object
      required: [id, status]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [REVOKED]
