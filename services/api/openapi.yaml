openapi: 3.0.3
info:
  title: SaiFlow API
  version: 1.3.0
  description: |
    SaiFlow 后端接口（Flask，`services/api`）。本文件是对外接口契约的唯一来源，
    `docs/30-design/API-Spec.md` 由其生成发布，请勿手写第二份。

    ## 通用约定
    - 所有业务接口位于 `/api/v1`；未启用版本（如 `/api/v2/...`）与旧的无版本 `/api/...` 业务路径一律 404。
    - 成功响应：`{"code": "OK", "data": ...}`（见 `OkEnvelope`）。
    - 失败响应：`{"code", "message_key", "request_id", "retryable", "field_errors"}`（见 `Error`），
      `message_key` 为前端 i18n 文案键。
    - 时间字段为 UTC 的 ISO 8601 字符串（无时区后缀）。

    ## 归属：只有 tenant_id
    - 业务归属的唯一表达是 `tenant_id`（`tenants` 表）。个人用户（含游客）各占一个 PERSONAL 租户，
      每个公司各占一个 ENTERPRISE 租户（`enterprises.tenant_id` 一对一扩展）。
    - 请求侧：`POST /uploads`、`POST /file-imports`、`POST /me/plan-applications` 在 JSON body 中接受可选
      `tenant_id`；`GET /me/subscription`、`GET /ocr/jobs` 以查询参数接受 `tenant_id`。
      缺省或空值 = 调用者本人的个人租户。
    - 响应侧：身份/租户列表与业务对象一律返回 `tenant_id`（企业租户另给 `tenant_type` / `name` / `role`）。

    ## 套餐与计量
    - 没有 FREE 档位、没有赠送任务额度。每个租户恰好一行订阅：个人租户（含游客）自 `tenants.created_at`
      起默认开通默认套餐（`plans.is_default`，当前为 Kinder）`trial_months` 个月（当前 1）；企业租户自 `enterprises.verified_at` 起算，未认证时无订阅（`status=NONE`）。
    - 套餐目录、价格展示、月页数、席位、泰英文案与审批续期月数均来自 `plans` 表配置（FR-SYS-019，CLI `manage_plans.py` 维护），
      修改立即对所有租户生效（不做订阅快照）。
    - 唯一计量单位是 `OCR_PAGE`（每月页数），按泰国时间（UTC+7）自然月实时统计 `ocr_jobs.page_count`，
      FAILED / CANCELLED 的任务不计，因此没有消耗流水、也没有取消返还。
    - 订阅到期后新建任务被硬停（402 `PLAN_EXPIRED`）；订阅仍 ACTIVE 但本月页数用尽为 402 `QUOTA_EXCEEDED`。
      已有任务、结果与导出在任何情况下都可继续查看与导出。

    ## 认证与 CSRF
    - 免登录白名单（精确匹配）：`POST /auth/line`、`POST /auth/guest`；其余接口必须携带会话 Cookie `saiflow_session`（HttpOnly，path=/api）。
    - 写请求（POST/PUT/PATCH/DELETE）还必须携带请求头 `X-CSRF-Token`，其值来自登录 / `GET /auth/session` 响应中的 `csrf_token`。
    - 跨用户 / 跨租户访问不存在或无权的对象统一返回 404，不泄露资源存在性。

    ## 错误码
    | HTTP | code | 说明 |
    |------|------|------|
    | 400 | INVALID_ARGUMENT | 参数校验失败，`field_errors` 给出字段级原因 |
    | 401 | AUTH_REQUIRED / SESSION_EXPIRED / SESSION_REVOKED | 未登录 / 会话过期 / 会话已吊销 |
    | 402 | PLAN_EXPIRED / QUOTA_EXCEEDED | 订阅已到期或未开通（`plan.expired`）/ 本月页数已用尽（`quota.exceeded`） |
    | 403 | ACCOUNT_DISABLED / PERMISSION_DENIED / CSRF_INVALID / ENTERPRISE_ACCESS_REVOKED | 账号禁用 / 无权限 / CSRF 校验失败 / 企业访问权已撤销 |
    | 404 | RESOURCE_NOT_FOUND | 资源不存在或无权访问 |
    | 409 | STATE_CONFLICT / VERSION_CONFLICT | 状态不允许 / 乐观并发版本冲突 |
    | 409 | TEMPLATE_MAPPING_DISABLED / RAW_RESULT_MISSING / TEMPLATE_UNAVAILABLE / MAPPING_NOT_READY / MAPPING_LIMIT_REACHED | 模板映射：功能关闭 / 无 OCR 解析结果 / 模板不可用 / 映射未成功 / 达到每任务映射上限 |
    | 422 | INVALID_ARGUMENT（`results.required_missing`） | 模板结果确认时必填字段缺失，`field_errors` 给出 `structured.<路径>` |
    | 429 | RATE_LIMITED | 请求过于频繁（retryable=true） |
    | 503 | SERVICE_UNAVAILABLE / AUTH_SERVICE_UNAVAILABLE / OCR_VENDOR_UNAVAILABLE / EMAIL_SERVICE_UNAVAILABLE / STORAGE_UNAVAILABLE / EXPORT_UNAVAILABLE / EXPORT_FAILED | 依赖服务不可用 |
servers:
  - url: /api/v1
    description: 当前部署（相对路径）
  - url: https://saiflow-api-920915040833.asia-southeast1.run.app/api/v1
    description: Cloud Run 正式环境
  - url: http://localhost:5000/api/v1
    description: 本地开发
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: 登录、游客会话、会话查询与注销
  - name: Me
    description: 当前用户资料、注册、邮箱、租户、通知与数据请求
  - name: Plans
    description: 套餐与订阅
  - name: Files
    description: 文件上传（上传会话）与原件访问
  - name: OCR
    description: OCR 识别任务
  - name: Results
    description: 识别结果查询与人工核验修改
  - name: Templates
    description: 文档格式模板（只读）与任务的模板选择、切换
  - name: Exports
    description: 结果导出与下载
  - name: Enterprises
    description: 企业创建、认证资料、绑定与解绑
  - name: Applications
    description: 入企申请与企业邀请
  - name: Ops
    description: 运维端点（不在 /api/v1 下）
paths:
  /auth/line:
    post:
      tags: [Auth]
      summary: LINE 登录换取会话
      description: |
        用 LINE ID token 换取 SaiFlow 会话（免登录白名单接口，精确匹配 POST，不校验 CSRF）。

        正常流程：服务端以 POST form 调用 LINE `https://api.line.me/oauth2/v2.1/verify`
        （id_token + client_id=LINE_CHANNEL_ID）验真，并本地复核 iss=`https://access.line.me`、
        aud 包含渠道 ID、exp 未过期。按 (line_provider=line, line_sub=sub) 新建或复用用户；
        未完成注册（registered=false）的用户会用 LINE 资料（name/picture/email/phone_number）
        刷新 display_name/avatar_url/email/phone，已注册用户的资料不被覆盖。

        AUTH_DEV_MODE 开发兜底：当 `id_token` 为空、提供 `dev_id` 且服务端开启 AUTH_DEV_MODE 时，
        以 line_sub=`dev:<dev_id>` 建立开发身份（首次创建时随机生成昵称、手机号、邮箱（约 1/3 概率为空）
        与首字母 PNG 头像）；dev_id 超过 64 字符返回 400 `error.invalid_argument`。
        未开启 AUTH_DEV_MODE 时 dev_id 被忽略，按缺少 id_token 处理。

        游客归并：若请求携带有效的游客会话 Cookie，登录成功后游客的全部数据（文件、任务、结果版本、导出、
        申请、通知、审计、成员关系等）归并到该真实账号；游客个人租户的订阅与到期提醒记录被删除，
        其套餐申请的 `target_tenant_id` 改指向真实账号的个人租户，随后游客账号及其会话被删除。

        成功后签发新会话（Set-Cookie `saiflow_session`，HttpOnly）并下发明文 CSRF token；
        同时幂等确保该用户的个人租户存在并已开通一个月 Kinder 订阅（`source=DEFAULT`，自
        `tenants.created_at` 起算，已有订阅行不会被重置）。`language` 仅接受 th/en，其他值忽略。

        错误：
        - 400 INVALID_ARGUMENT `auth.id_token_required`（未提供 id_token 且未走开发兜底）、`error.invalid_argument`（dev_id 过长）
        - 401 AUTH_REQUIRED `auth.line_token_invalid`（LINE 验真非 200 或 iss 不符）、`auth.line_channel_mismatch`、`auth.line_token_expired`
        - 503 AUTH_SERVICE_UNAVAILABLE `auth.line_not_configured`（未配置 LINE_CHANNEL_ID）、`auth.line_verify_unavailable`（调用 LINE 网络失败），retryable=true
      operationId: authLine
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLineRequest'
      responses:
        '200':
          description: 登录成功，已签发会话 Cookie
          headers:
            Set-Cookie:
              description: "saiflow_session=<token>; HttpOnly; Max-Age=<绝对过期秒数>"
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthPayload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/guest:
    post:
      tags: [Auth]
      summary: 创建或复用游客会话
      description: |
        免登录白名单接口（不校验 CSRF）。若请求已携带有效会话（游客或真实用户），直接复用该会话：
        轮换 CSRF token 并返回当前用户与可见租户列表，不签发新 Cookie。
        否则新建游客用户（line_provider=guest，display_name=Guest，status=ACTIVE），签发新会话
        （Set-Cookie `saiflow_session`），同时创建其个人租户并幂等开通一个月 Kinder 订阅
        （`source=DEFAULT`，自 `tenants.created_at` 起算）；游客不发送到期提醒。
        游客可上传与核验，之后经 POST /auth/line 登录时数据自动归并到真实账号
        （游客租户的订阅与提醒记录随之清除，套餐申请改指向真实账号的个人租户）。
        `language` 仅接受 th/en，其他值忽略（默认 th）。
      operationId: authGuest
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
                  enum: [th, en]
                  description: 界面语言；非 th/en 时忽略
      responses:
        '200':
          description: 游客会话已建立或复用（仅新建时返回 Set-Cookie）
          headers:
            Set-Cookie:
              description: 新建游客会话时下发 saiflow_session（HttpOnly）
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthPayload'

  /auth/session:
    get:
      tags: [Auth]
      summary: 获取当前会话并轮换 CSRF
      description: |
        返回当前会话摘要（用户、可见租户、签发与绝对过期时间），并轮换下发新的 CSRF token
        （旧 CSRF token 立即失效）。需登录态（游客会话亦可）。
        时间字段为 UTC 的 ISO 8601 字符串（无时区后缀）。
        错误：401 AUTH_REQUIRED / SESSION_EXPIRED / SESSION_REVOKED；403 ACCOUNT_DISABLED。
      operationId: getAuthSession
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前会话
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSessionPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      description: |
        撤销当前会话（置 revoked_at）并清除会话 Cookie。无请求体。
        错误：401 AUTH_REQUIRED / SESSION_EXPIRED / SESSION_REVOKED；403 ACCOUNT_DISABLED / CSRF_INVALID。
      operationId: authLogout
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: 已退出
          headers:
            Set-Cookie:
              description: 清除 saiflow_session
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [logged_out]
                        properties:
                          logged_out:
                            type: boolean
                            enum: [true]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me:
    get:
      tags: [Me]
      summary: 获取当前用户
      description: |
        返回当前登录用户资料（游客亦可）。
        错误：401 AUTH_REQUIRED / SESSION_EXPIRED / SESSION_REVOKED；403 ACCOUNT_DISABLED。
      operationId: getMe
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Me]
      summary: 更新个人资料
      description: |
        字段白名单：display_name / phone / language / avatar_url，仅更新请求体中出现的字段，其他字段忽略。
        有字段变更时提交并记审计 `me.update`；无变更时原样返回当前用户。

        - display_name：去除首尾空白后长度 1–128。
        - phone：个人中心可修改（FR-SYS-015），校验与注册完全一致——空串清空；否则去空白后 ≤32 字符，
          只允许 `+`、数字、空格、`(`、`)`、`.`、`-`，剔除非数字后须为 6–15 位数字。游客不可修改（403 PERMISSION_DENIED）。
        - language：th 或 en。
        - avatar_url：游客不可修改（403 PERMISSION_DENIED）。取值规则——与当前头像地址相同视为不变；
          空串清除头像；以 `https://` 开头且不超过 1024 字符时作为外部头像引用保存；
          否则须为 `data:image/(png|jpeg|webp);base64,...` data URL，解码后不超过 300 KB 且文件头与声明类型一致，
          图片转存对象存储，之后 avatar_url 返回 `/api/v1/me/avatar?v=<版本>`。

        错误：
        - 400 INVALID_ARGUMENT `error.invalid_argument`，field_errors：display_name→`error.field_required`；
          phone→`error.phone_invalid`；language→`error.invalid_argument`；avatar_url→`error.avatar_invalid`
        - 403 PERMISSION_DENIED `error.permission_denied`（游客改手机号或头像）；CSRF_INVALID；ACCOUNT_DISABLED
        - 503 STORAGE_UNAVAILABLE `avatar.upload_failed`（头像对象存储失败）
      operationId: updateMe
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /me/quota:
    get:
      tags: [Me]
      summary: 获取租户额度与订阅视图
      description: |
        返回当前用户所有有效租户（本人个人租户 + ACTIVE 成员且企业 VERIFIED 的企业租户）的额度视图。
        查询时会幂等补开默认订阅（个人租户按 `tenants.created_at`、企业租户按 `enterprises.verified_at`
        起算 Kinder 一个月），企业未认证时不开通。

        - 计量唯一单位为 `OCR_PAGE`（`plan.metering` 恒为 OCR_PAGE），不存在赠送任务与 FREE 档位。
        - `plan.source`：DEFAULT=系统默认开通的一个月 / APPROVED=人工审批续费 / null（无订阅）；
          `plan.is_paid` 仅在 source=APPROVED 时为 true，ACTIVE 不代表已付款。
        - `subscription.status`：ACTIVE / EXPIRED / NONE（企业未认证，无订阅行）；
          `days_remaining` 为泰国时区自然日（0=今天到期，负数=已过期），NONE 时为 null。
        - `pages`：订阅 ACTIVE 时为本月权益与剩余页数（泰国时间自然月实时统计，FAILED/CANCELLED 不计）；
          非 ACTIVE 时 `remaining` 恒为 0。
        错误：401 AUTH_REQUIRED / SESSION_EXPIRED / SESSION_REVOKED；403 ACCOUNT_DISABLED。
      operationId: getMeQuota
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 额度与订阅视图
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [tenants]
                        properties:
                          tenants:
                            type: array
                            items:
                              $ref: '#/components/schemas/QuotaTenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/avatar:
    get:
      tags: [Me]
      summary: 获取当前用户头像图片
      description: |
        后端代理读取对象存储中的当前用户头像字节（会话鉴权，不生成匿名/签名 URL）。
        响应头 `Cache-Control: private, max-age=86400`、`X-Content-Type-Options: nosniff`；
        Content-Type 按对象扩展名为 image/png、image/jpeg 或 image/webp。
        查询参数 v 仅用于绕过缓存，服务端不读取。
        错误：404 RESOURCE_NOT_FOUND（用户无已转存头像，或对象不存在；外部 https 头像不经此接口）；
        401 AUTH_REQUIRED / SESSION_EXPIRED / SESSION_REVOKED；403 ACCOUNT_DISABLED。
      operationId: getMeAvatar
      security:
        - sessionCookie: []
      parameters:
        - name: v
          in: query
          required: false
          description: 头像版本号（缓存击穿用，服务端忽略）
          schema:
            type: string
      responses:
        '200':
          description: 头像图片字节
          headers:
            Cache-Control:
              schema:
                type: string
                example: "private, max-age=86400"
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/registration:
    post:
      tags: [Me]
      summary: 补录注册信息
      description: |
        LINE 登录后补录注册信息（FR-SYS-014）。仅非游客可调用。Phone/Email 默认使用服务端验证后的 LINE
        token 资料；email 需要对应 scope 与授权，标准 LINE Login 不保证提供手机号；缺失时可手填。
        Phone 可编辑且可选（≤32 字符、6–15 位数字，可含前导 +、空格、括号、点和短横线；空串可清空，省略保留原值）。
        依次校验 display_name（去空白后 1–128）、phone、email（≤254 且格式合法）、code（必填，6 位数字，校验并消费
        发往该邮箱且未过期（10 分钟）的最新验证码；仅显式本地 AUTH_DEV_MODE 下只要求非空、不校验）。
        可选 avatar_url，规则同 PATCH /me。成功保存 phone/email/display_name/avatar_url，registered=true，记审计 `user.register`。

        错误：
        - 400 INVALID_ARGUMENT，field_errors：display_name→`error.field_required`；phone→`error.phone_invalid`；email→`error.field_required`/`error.email_invalid`；code→`error.field_required`/`error.email_code_invalid`；avatar_url→`error.avatar_invalid`
        - 403 PERMISSION_DENIED `error.permission_denied`（游客）；CSRF_INVALID；ACCOUNT_DISABLED
