        （FR-SYS-019，`manage_plans.py` 维护），停用套餐不返回；当前为 KINDER / STARTER / INTERMEDIATE / ADVANCE，
        每月页数 Kinder 1,000 / Starter 5,000 / Intermediate 10,000 / Advance 100,000。配置修改最迟 60 秒内生效。
        每项除英文 `name`/`price.display`/`features` 外，`i18n` 给出 en/th 双语文案，`theme` 给出卡片样式，
        `is_default` 标记默认开通套餐。
        币种 THB，支付完全线下（payment=OFFLINE，联系销售开通/续费），无在线下单、无回调、无自动续费。
        本接口只返回目录，不接受 `tenant_id`，也不含任何租户状态。需登录态。
        错误：401 AUTH_REQUIRED / SESSION_EXPIRED / SESSION_REVOKED；403 ACCOUNT_DISABLED。
      operationId: listPlans
