  /me/subscription:
    get:
      tags: [Plans]
      summary: 获取租户订阅状态
      description: |
        返回指定租户的订阅状态（`tenant_id` 缺省/空值 = 本人个人租户）。每个租户恰好一行订阅，
        首次查询时按默认规则幂等开通 Kinder 一个月：个人租户（含游客）自 `tenants.created_at` 起算；
        企业租户自 `enterprises.verified_at` 起算（人工把 `enterprises.status` 改为 VERIFIED 后，
        服务端首次读到时补填 `verified_at`）。自然月加法带夹取：2026-01-31 + 1 月 → 2026-02-28。

        - `status`：ACTIVE=有效期内 / EXPIRED=已到期（不能再新建 OCR 任务，历史仍可读） /
          NONE=企业尚未认证，无订阅行，plan 与日期字段均为 null。
        - `source`：DEFAULT=系统默认开通的一个月 / APPROVED=人工审批续费开通；`application_id` 为据以续期的申请 ID。
        - `days_remaining`：泰国时区自然日（0=今天到期，负数=已过期）；NONE 时为 null。
        - `pending`：本租户处理中的 PLAN_UPGRADE 申请简述（SUBMITTED/UNDER_REVIEW/NEEDS_INFO），无则 null。
          pending 既不提升也不降低当前权益，前端应在 `status != ACTIVE` 且 pending 非空时才显示「处理中」。
        - `can_manage`：个人租户恒为 true；企业租户仅 ACTIVE 的 OWNER 为 true。

        错误：
        - 400 INVALID_ARGUMENT `error.invalid_workspace`（`tenant_id` 无法解析为整数、租户不存在，或租户类型非法）
        - 403 PERMISSION_DENIED `error.permission_denied`（他人的个人租户；或企业租户但本人无成员行/企业不存在）；
          ACCOUNT_DISABLED `auth.account_disabled`（本人个人租户 status 非 ACTIVE）；
          ENTERPRISE_ACCESS_REVOKED `error.enterprise_access_revoked`（成员非 ACTIVE、企业未 VERIFIED 或租户非 ACTIVE）
        - 401 AUTH_REQUIRED / SESSION_EXPIRED / SESSION_REVOKED
      operationId: getMeSubscription
      security:
        - sessionCookie: []
      parameters:
        - name: tenant_id
          in: query
          required: false
          description: 目标租户 ID（`tenants.id`）；缺省或空值表示本人个人租户
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 订阅状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/plan-applications:
    post:
      tags: [Plans]
      summary: 提交套餐升级/续费申请
      description: |
        为指定租户（`tenant_id` 缺省 = 本人个人租户）登记套餐开通/续费意向工单
        （applications.type=PLAN_UPGRADE，status=SUBMITTED，target_tenant_id=该租户），
        由后台人工审核开通，无在线支付。游客不可提交（401）。企业租户仅该企业 ACTIVE 的 OWNER 可提交。

        线下续费闭环：运营把申请置为 APPROVED，并在 `applications.form` 写 `valid_from` / `valid_to`
        （或 `period_months`）；服务端在下次读取订阅时惰性生效一次（`source=APPROVED`，记录 `application_id`，
        同一申请绝不重复生效）。若当期尚未到期，新周期从当前 `expires_at` 接续，不浪费剩余天数。

        档位规则：订阅 ACTIVE 时拒绝降档（409 `plan.not_upgrade`），允许同档续费与升档；
        EXPIRED / NONE 时任意档位均可申请。成功记审计 `plan_application.submit`、给本人发通知
        PLAN_UPGRADE_SUBMITTED，并返回该租户最新订阅视图（`pending` 非空，`status` 保持原值）。

        错误：
        - 400 INVALID_ARGUMENT `error.invalid_argument`（plan_code 不在目录中：field_errors `{field: plan_code, reason: invalid}`；
          `tenant_id` 存在但不是 JSON 整数：`{field: tenant_id, reason: invalid}`，注意此处 field_errors 使用 reason 而非 message_key）；
          `error.invalid_workspace`（`tenant_id` 指向不存在或类型非法的租户）
        - 401 AUTH_REQUIRED `auth.login_required`（游客会话）；SESSION_EXPIRED / SESSION_REVOKED
        - 403 PERMISSION_DENIED `plan.enterprise_owner_only`（非企业 ACTIVE OWNER）/ `error.permission_denied`（他人个人租户或非该企业成员）；
          ENTERPRISE_ACCESS_REVOKED；ACCOUNT_DISABLED；CSRF_INVALID
        - 409 STATE_CONFLICT `plan.application_pending`（该租户已有处理中申请）、`plan.not_upgrade`（ACTIVE 期间申请更低档位）
      operationId: submitPlanApplication
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanApplicationRequest'
      responses:
        '201':
          description: 申请已提交，返回最新订阅视图
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  # ===================== Files (routes/files.py) =====================
  /uploads:
    post:
      tags: [Files]
      summary: 创建上传会话
      description: |
        三段式上传第 1 步：POST /uploads（预检并建会话）→ PUT /uploads/{upload_id}/content（原始字节请求体）→ POST /uploads/{upload_id}/complete（校验并置 READY）。
        文件状态机：UPLOADING → UPLOADED → VALIDATING → READY / REJECTED。

        本接口预检租户归属、用途、扩展名与声明大小，创建 status=UPLOADING 的文件记录，返回 201。
        - `file_name` 中 `[A-Za-z0-9._-]`、空格、泰文、中日韩统一表意文字以外的字符替换为 `_`，并截断为 255 字符；扩展名（小写）必须为 jpg/jpeg/png/pdf。
        - `size_bytes` 若提供且大于 20MB（20971520）直接拒绝；此时不校验实际字节（实际大小在 PUT content 阶段校验）。
        - 归属：`tenant_id` 缺省或为空值时落在本人个人租户（缺失时幂等补建）；传企业租户 ID 时当前用户须为该企业
          ACTIVE 成员、企业状态为 VERIFIED、租户 status 为 ACTIVE。

        错误：
        - 400 INVALID_ARGUMENT：`error.invalid_argument`（purpose 非法）、`error.invalid_workspace`（`tenant_id` 无法解析为整数、租户不存在或类型非法）、`files.unsupported_type`（field_errors 指向 file_name）、`files.too_large`。
        - 403 PERMISSION_DENIED（他人的个人租户，或企业租户但本人无成员行/企业不存在）、ACCOUNT_DISABLED（本人个人租户非 ACTIVE）、ENTERPRISE_ACCESS_REVOKED（`error.enterprise_access_revoked`，成员非 ACTIVE、企业未 VERIFIED 或租户非 ACTIVE）、CSRF_INVALID。
      operationId: createUpload
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCreateRequest'
      responses:
        '201':
          description: 已创建上传会话（文件 status=UPLOADING）。`upload_id` 与 `file.id` 相同。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /uploads/{upload_id}/content:
    put:
      tags: [Files]
      summary: 上传文件内容
      description: |
        三段式上传第 2 步：请求体为文件原始字节（不是 multipart，服务端不校验 Content-Type）。
        - 仅上传会话的创建者可调用，否则 404。
        - 文件状态须为 UPLOADING / UPLOADED / REJECTED（允许覆盖重传；REJECTED 后可重传），否则 409 STATE_CONFLICT（`error.state_conflict`）。
        - 字节大于 20MB：文件置 REJECTED，返回 400 `files.too_large`；请求体超过 MAX_CONTENT_LENGTH（20MB）时框架直接返回 400 INVALID_ARGUMENT `files.too_large`。
        - 魔数校验：jpg/jpeg 须为 JPEG（FF D8 FF）、png 须为 PNG 签名、pdf 须以 `%PDF` 开头，且须与会话文件名扩展名一致；否则文件置 REJECTED，返回 400 `files.disguised_type`。
        - 成功后写入对象存储，计算 size_bytes 与 sha256，文件置 UPLOADED 并清空 reject_reason。
      operationId: uploadContent
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: upload_id
          in: path
          required: true
          description: 上传会话 ID（即文件 ID，32 位十六进制 UUID）。
          schema:
            type: string
      requestBody:
        required: true
        description: 文件原始字节（最大 20MB）。
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 内容已接收，文件 status=UPLOADED。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadContentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /uploads/{upload_id}/complete:
    post:
      tags: [Files]
      summary: 完成上传并校验
      description: |
        三段式上传第 3 步：确认上传，置 VALIDATING 后校验完整性与页数，通过则置 READY。
        - 仅上传会话的创建者可调用，否则 404。
        - 已为 READY 时幂等返回 200 与当前文件；状态非 UPLOADED（且非 READY）返回 409 STATE_CONFLICT。
        - PDF 用 pypdf 读取页数，损坏/加密 → 400 `files.corrupt_or_encrypted`；图片页数记为 1。
        - purpose=OCR_TASK 时：PDF 页数 > 50 → 400 `files.too_many_pages`；图片页数 > 1 → 400 `files.invalid`。APPLICATION_MATERIAL 不做页数限制。
        - 以上校验失败时文件置 REJECTED，reject_reason 为对应 message_key。
        Body 无需参数（不读取请求体）。
      operationId: completeUpload
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: upload_id
          in: path
          required: true
          description: 上传会话 ID（即文件 ID，32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '200':
          description: 文件已 READY（含幂等重放）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FilePayload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /file-imports:
    post:
      tags: [Files]
      summary: 通过 URL 导入文件
      description: |
        服务端受控抓取公网文件并直接生成 READY 文件（purpose 固定为 OCR_TASK），返回 201。
        - `url` 必须为 http/https 且含主机名，否则 400 `file_import.invalid_url`。
        - 抓取：连接超时 10s、总超时 20s、跟随重定向；非 200 响应或网络错误 → 400 `file_import.fetch_failed`；累计超过 20MB → 400 `files.too_large`。
        - 类型按魔数判定（JPEG/PNG/PDF），无法识别 → 400 `files.unsupported_type`；文件名取 URL 路径末段（净化并补齐扩展名），缺省为 `import.<ext>`。
        - PDF 损坏/加密 → 400 `files.corrupt_or_encrypted`（文件记录以 REJECTED 落库）。本接口不校验 50 页上限。
        - 归属规则同 POST /uploads（body 可选 `tenant_id`，缺省为本人个人租户；企业租户需 ACTIVE 成员资格、企业 VERIFIED，否则 400 `error.invalid_workspace` / 403）。
      operationId: importFileFromUrl
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileImportRequest'
      responses:
        '201':
          description: 已导入，文件 status=READY。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FilePayload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /files/{file_id}:
    get:
      tags: [Files]
      summary: 获取文件信息
      description: |
        返回文件元数据。可见范围：本人创建的文件，或文件归属租户在当前用户可访问租户列表内（企业租户须为 ACTIVE 成员）；其他情况一律 404（不泄露存在性）。
      operationId: getFile
      security:
        - sessionCookie: []
      parameters:
        - name: file_id
          in: path
          required: true
          description: 文件 ID（32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '200':
          description: 文件信息。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FilePayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /files/{file_id}/content:
    get:
      tags: [Files]
      summary: 读取或下载原件
      description: |
        后端从对象存储取回原件字节并代理下发（需会话鉴权，不提供匿名/签名 URL）。
        - 访问控制同 GET /files/{file_id}。
        - 文件状态须为 READY 或 UPLOADED，且对象存在，否则 404。
        - `download=1` 时以附件下发（Content-Disposition: attachment，文件名为 original_name）；否则内联返回，不带 Content-Disposition。
        - Content-Type 为文件的 mime_type（image/jpeg、image/png、application/pdf）。
      operationId: getFileContent
      security:
        - sessionCookie: []
      parameters:
        - name: file_id
          in: path
          required: true
          description: 文件 ID（32 位十六进制 UUID）。
          schema:
            type: string
        - name: download
          in: query
          required: false
          description: 取值为 `1` 时作为附件下载；其他值或缺省为内联。
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: 原件字节。
          headers:
            Content-Disposition:
              description: 仅 `download=1` 时返回，形如 `attachment; filename=...`（非 ASCII 文件名附带 `filename*=UTF-8''...`）。
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /files/{file_id}/pages/{page}/preview:
    get:
      tags: [Files]
      summary: 获取页预览图
      description: |
        页预览（需会话鉴权，后端代理下发，内联返回无 Content-Disposition）。
        - 访问控制同 GET /files/{file_id}；文件状态须为 READY 或 UPLOADED，否则 404。
        - PDF：用 PyMuPDF 以 2 倍缩放渲染第 `page` 页（1 起）为 PNG，结果缓存于对象存储 `previews/<file_id>/page_<n>.png`；页码越界 → 404；PDF 损坏 → 400 `files.corrupt_or_encrypted`。
        - 图片：仅 `page=1` 有效（否则 404），直接返回原图（Content-Type 为其 mime_type）。
      operationId: getFilePagePreview
      security:
        - sessionCookie: []
      parameters:
        - name: file_id
          in: path
          required: true
          description: 文件 ID（32 位十六进制 UUID）。
          schema:
            type: string
        - name: page
          in: path
          required: true
          description: 页码（1 起）。
          schema:
            type: integer
      responses:
        '200':
          description: 预览图字节。
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===================== OCR (routes/ocr.py) =====================
  /ocr/capabilities:
    get:
      tags: [OCR]
      summary: 获取 OCR 能力与限额
      description: 返回 OCR 厂商（固定 textin）、支持的特性与上传/任务限额（取自服务端配置）。
      operationId: getOcrCapabilities
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 能力与限额。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrCapabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ocr/jobs:
    post:
      tags: [OCR]
      summary: 创建 OCR 任务
      description: |
        基于 READY 且 purpose=OCR_TASK 的文件创建 OCR 任务（status=QUEUED，progress=0），由进程内 worker 异步处理；返回 201 与任务摘要。
        - 任务归属租户由源文件推导（与文件同 `tenant_id`）；创建前会再次解析该租户——企业租户会校验当前用户为 ACTIVE 成员、企业 VERIFIED 且租户 ACTIVE（否则 403 PERMISSION_DENIED / ENTERPRISE_ACCESS_REVOKED）。
        - 文件不可见 → 404；purpose 非 OCR_TASK → 400 `job.file_purpose_invalid`；文件非 READY → 409 STATE_CONFLICT `job.file_not_ready`。
        - 页范围（文件 page_count > 0 时校验）：起始页 = `params.page`(0 起) + 1，超过文件页数 → 400 `job.page_out_of_range`；`params.page_count`（缺省为 min(文件页数, 50)）> 50 → 400 `job.page_count_exceeded`。
        - 幂等：`Idempotency-Key` 请求头优先，body `idempotency_key` 兜底（去首尾空白后 1~128 字符）。命中已有任务且当前用户可见（本人创建或任务租户可访问）→ 200 原样返回该任务摘要；命中但不可见 → 404。
        - 订阅门禁（在任务入库的同一事务内检查）：
          - 订阅非 ACTIVE（已过期，或企业尚未认证因而无订阅行）→ 402 PLAN_EXPIRED（`plan.expired`），需人工审批续费后才能继续新建任务；
          - 订阅 ACTIVE 但本月页数已用尽 → 402 QUOTA_EXCEEDED（`quota.exceeded`）。
          月页数按泰国时间（UTC+7）自然月实时统计该租户 `ocr_jobs.page_count`，FAILED/CANCELLED 不计，不存在赠送额度或消耗流水。
        - 仅 `params` 中的 parse_mode/table/formula/rotate/page/page_count 及 `field_names` 会被保存，其他键忽略。
        - 参数非法时 400 INVALID_ARGUMENT，field_errors 形如 `{field: file_id|params|field_names|page|page_count|idempotency_key, reason: required|invalid}`。
      operationId: createOcrJob
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 幂等键（1~128 字符）；优先于 body.idempotency_key。
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcrJobCreateRequest'
      responses:
        '200':
          description: 幂等重放，返回已存在的任务摘要。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrJobSummary'
        '201':
          description: 已创建任务（status=QUEUED）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrJobSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [OCR]
      summary: 分页查询 OCR 任务
      description: |
        列出当前用户可见的任务：本人个人租户任务 + 当前用户为 ACTIVE 成员的所有企业租户任务（含其他成员创建的）。按 created_at 倒序。
        过滤条件可组合：
        - `status`：逗号分隔，大小写不敏感；取值须属于 QUEUED/PREPROCESSING/PROCESSING/POSTPROCESSING/SUCCEEDED/PARTIAL_SUCCESS/FAILED/CANCELLED（CANCEL_REQUESTED 不可作为筛选值），否则 400（field=status）。
        - `tenant_id`：只看该租户的任务。无法解析为整数 → 400（field=tenant_id）；不在当前用户可访问租户列表内 → 404（不泄露存在性）。
        - `stage`：OCR_PROCESSING（非终态）/ OCR_FAILED（FAILED、CANCELLED）/ TEMPLATE_MATCHING（成功、未确认且有进行中的模板映射 pending_mapping_id）/ VERIFYING（成功、未确认且无进行中的映射）/ VERIFIED（已确认但 completed_at 为空）/ COMPLETED（已确认且 completed_at 非空）；非法值 400（field=stage）。
        - `q`：按源文件名（original_name）不区分大小写子串匹配。
        - 分页：`page` ≥ 1，`page_size` 1~100，非法时 400（field=page）。
        订阅到期（402 `plan.expired`）只拦截新建任务，不影响本接口：历史任务始终可查。
      operationId: listOcrJobs
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          description: 逗号分隔的任务状态列表，例如 `SUCCEEDED,PARTIAL_SUCCESS`。
          schema:
            type: string
        - name: tenant_id
          in: query
          required: false
          description: 目标租户 ID（`tenants.id`）；缺省表示全部可见租户。
          schema:
            type: integer
            format: int64
        - name: stage
          in: query
          required: false
          description: 流程阶段（大小写不敏感）。
          schema:
            type: string
            enum: [OCR_PROCESSING, OCR_FAILED, TEMPLATE_MATCHING, VERIFYING, VERIFIED, COMPLETED]
        - name: q
          in: query
          required: false
          description: 文件名关键字。
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 任务分页列表。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrJobPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /ocr/jobs/{job_id}:
    get:
      tags: [OCR]
      summary: 获取 OCR 任务详情
      description: 返回任务摘要（用于轮询状态与进度）。可见范围：本人创建，或任务归属租户在当前用户可访问租户列表内（企业租户须为 ACTIVE 成员）；否则 404。
      operationId: getOcrJob
      security:
        - sessionCookie: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: OCR 任务 ID（32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '200':
          description: 任务摘要。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrJobSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [OCR]
      summary: 删除任务结果
      description: |
        删除任务的全部结果数据：所有 ResultVersion、PageResult、关联导出（含对象存储中的导出文件），以及该任务的模板映射与 OCR 解析结果（ocr_raw_results）；任务的 current_mapping_id / pending_mapping_id 清空。任务记录本身保留。
        - 任务须为终态（SUCCEEDED/PARTIAL_SUCCESS/FAILED/CANCELLED），否则 409 STATE_CONFLICT `job.not_terminal`。
        - 可见性同 GET /ocr/jobs/{job_id}，不可见 → 404。
      operationId: deleteOcrJobResults
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: OCR 任务 ID（32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '200':
          description: 结果已删除。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrJobResultsDeleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /ocr/jobs/{job_id}/cancel:
    post:
      tags: [OCR]
      summary: 取消 OCR 任务
      description: |
        - 终态任务 → 409 STATE_CONFLICT `job.already_terminal`。
        - 已为 CANCEL_REQUESTED → 幂等返回当前摘要。
        - QUEUED → 直接置 CANCELLED 并写 finished_at。月页数只统计非 FAILED/CANCELLED 的任务，
          取消即自动不计入本月消耗，没有额度返还步骤。
        - 处理中（PREPROCESSING/PROCESSING/POSTPROCESSING）→ 置 CANCEL_REQUESTED，由 worker 终止。
        可见性同 GET /ocr/jobs/{job_id}。无请求体。
      operationId: cancelOcrJob
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: OCR 任务 ID（32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '200':
          description: 取消后的任务摘要。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrJobSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /ocr/jobs/{job_id}/rerun:
    post:
      tags: [OCR]
      summary: 重新识别
      description: |
        以原任务的文件、params 与能力快照创建新任务（status=QUEUED，parent_job_id 指向原任务，创建者为当前用户），返回 201。
        - 原任务须为终态，否则 409 `job.not_terminal`；源文件不存在或非 READY → 409 `job.file_not_ready`。
        - 企业租户文件再次校验 ACTIVE 成员资格与企业 VERIFIED（403）。
        - 订阅门禁同创建任务：非 ACTIVE → 402 PLAN_EXPIRED（`plan.expired`）；本月页数用尽 → 402 QUOTA_EXCEEDED（`quota.exceeded`）。
        无请求体。
      operationId: rerunOcrJob
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: OCR 任务 ID（32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '201':
          description: 新任务摘要。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrJobSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ===================== Results (routes/results.py) =====================
  /ocr/jobs/{job_id}/results:
    get:
      tags: [Results]
      summary: 获取当前识别结果
      description: |
        返回任务当前结果版本（is_current=true）。`structured` 为 TextIn Prompt 模式结构化 JSON；旧版逐页结果没有 structured 时折算为 `{fields: {名称: 值}, tables: [[[单元格文本]]]}`。`pages` 为旧版逐页数据（Prompt 任务为空数组）。
        - 尚无结果且任务非终态 → 409 STATE_CONFLICT `results.not_ready`；任务已终态但无结果（如失败或结果已删除）→ 404。
        - 可见性同 GET /ocr/jobs/{job_id}。
        - 模板映射附加字段（FR-VERIFY-018..020）：`raw_result_id`、`current_mapping`（当前版本所属映射，通用结果为 null）、`template_schema`（模板分组定义，前端按其渲染）、`pending_mapping`（正在进行的映射）、`latest_failed_mapping`（最近一次映射失败且之后没有成功）、`template_available`（功能开启、有 OCR 解析结果且有可用模板）、`validation`（模板结果的必填缺失与类型提示）。
      operationId: getOcrJobResults
      security:
        - sessionCookie: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: OCR 任务 ID（32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '200':
          description: 当前结果版本。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ResultVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      tags: [Results]
      summary: 复核编辑或确认结果
      description: |
        乐观并发：`expected_version` 必须等于当前版本号，否则 409 VERSION_CONFLICT（`error.version_conflict`）。
        两种编辑方式（互斥）：
        - `structured`：提交完整结构化 JSON（对象或数组，紧凑 UTF-8 序列化后 ≤ 2,000,000 字节）。与当前内容不同时按任务 max(version)+1 生成新版本，并按新 JSON 重算 table_count / field_count；与非空 `edits` 同时提交 → 400（reason=mutually_exclusive_with_structured）。
        - `edits`：旧版逐页结果按单元格修改 current_text（单元格 review_status 置 EDITED，raw_text 保留），生成新版本并复制全部页结果；目标单元格不存在 → 400，field_errors 含 `reason=cell_not_found` 及 page_number/table_id/row_index/column_index。
        `confirm` 为真时仅允许非游客且已完成注册的用户：在任何结果版本、单元格或任务状态写入前，
        游客拒绝为 401 AUTH_REQUIRED `auth.login_required`，已登录未注册拒绝为 403 PERMISSION_DENIED `registration.required`。
        已注册确认将任务 review_status 置 CONFIRMED，completed_at 为空时写入（阶段 COMPLETED）；
        历史 VERIFIED 任务在注册后显式 confirm 也可完成。仅确认且无内容变化时不生成新版本，并将当前版本所有单元格置 CONFIRMED。
        `confirm=false` 的草稿编辑仍允许游客/未注册用户；内容有变化且任务尚未 CONFIRMED 时，review_status 置 EDITED。不额外校验套餐订阅。
        其他错误：结果未就绪 409 `results.not_ready`；无结果 404；参数非法 400（field: expected_version reason=required；edits/edits[i] reason=invalid；structured reason=invalid|too_large）。
        模板结果（当前版本属于某个模板映射）：
        - 新版本号 = 任务内 max(version)+1，并继承当前版本的映射归属；PATCH 与模板切换在任务行锁下串行。
        - 保存前按模板补齐结构：缺失的模板字段补 null、表格行补齐列；模板外的字段、列与分组原样保留。
        - `confirm=true` 时按保存后的内容做必填校验，缺失 → 422 INVALID_ARGUMENT `results.required_missing`（field_errors: `structured.<group>.<field>` 或 `structured.<group>.<table>[i].<column>`，reason=required），不写入任何内容；草稿保存不校验。
        - 首次确认时，若任务有自动匹配映射，记录一次 `template.match_feedback` 审计（自动匹配模板与最终确认模板是否一致）。
      operationId: updateOcrJobResults
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: OCR 任务 ID（32 位十六进制 UUID）。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultUpdateRequest'
      responses:
        '200':
          description: 更新后的当前结果版本（无内容变化时版本号不变）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ResultVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ===================== Templates (routes/templates.py) =====================
  /templates/versions/{version_id}:
    get:
      tags: [Templates]
      summary: 获取模板版本快照
      description: |
        返回某个模板版本的分组定义（用于预览与按模板渲染结果）。版本只增不改；模板停用或删除后，已有映射引用的版本仍可读取（`status` / `deleted` 标明当前状态）。
        - 系统模板所有登录用户（含游客）可读；租户模板仅该租户可访问的用户可读，否则 404。
        - 不下发 `description`（仅供大模型匹配使用）。
      operationId: getTemplateVersion
      security:
        - sessionCookie: []
      parameters:
        - name: version_id
          in: path
          required: true
          description: 模板版本 ID（document_template_versions.id）。
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 模板版本快照。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TemplateVersionSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /ocr/jobs/{job_id}/template-options:
    get:
      tags: [Templates]
      summary: 获取任务可选模板与已有映射
      description: |
        模板选择框数据：任务租户可用的模板（系统模板 + 本租户启用模板，各取当前版本），按最近一次自动匹配的得分降序排列，第一项有得分时标记 `recommended`；单候选直接选中且成功的自动映射记为 1.0。另返回该任务 READY / FAILED 的映射列表。
        功能关闭（TEMPLATE_MAPPING_ENABLED=false）时 `enabled=false`、`templates` 为空数组。可见性同 GET /ocr/jobs/{job_id}。
      operationId: getTemplateOptions
      security:
        - sessionCookie: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: OCR 任务 ID（32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '200':
          description: 可选模板与已有映射。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TemplateOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /ocr/jobs/{job_id}/apply-template:
    post:
      tags: [Templates]
      summary: 套用模板或切换到已有映射
      description: |
        两种用法（都需 `expected_version` 等于当前版本号，否则 409 VERSION_CONFLICT）：
        - 传 `mapping_id`：切换到该任务一个 READY 映射最近保存的版本，返回 200 + 结果；映射不属于该任务 → 404；非 READY → 409 MAPPING_NOT_READY。
        - 传 `raw_result_id` + `template_id`：同一模板版本已有 READY 映射且未传 `force=true` → 直接切换，200 + 结果；同一模板版本已有进行中的映射 → 不新建，把 pending 指向它，202 + `{mapping}`；否则新建 MANUAL 映射（基准为当前版本），202 + `{mapping}`，由后台 Worker 转换，成功且期间结果未被修改、未确认时自动生效。
        切换只移动当前版本指针，不调用大模型、不复制数据，记录 `template.switched` 审计。
        错误：功能关闭 409 TEMPLATE_MAPPING_DISABLED（归属校验优先，他人任务一律 404）；识别未成功 409 `results.not_ready`；已确认 409 `results.already_confirmed`；无 OCR 解析结果 409 RAW_RESULT_MISSING；raw_result_id 不匹配 404；模板不存在、停用、删除或不属于该租户 409 TEMPLATE_UNAVAILABLE；映射数达到上限（TEMPLATE_MAX_MAPPINGS_PER_JOB，默认 5）409 MAPPING_LIMIT_REACHED；参数缺失或类型错误 400。
      operationId: applyTemplate
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: OCR 任务 ID（32 位十六进制 UUID）。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyTemplateRequest'
      responses:
        '200':
          description: 已切换到 READY 映射，返回切换后的当前结果。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ResultVersion'
        '202':
          description: 映射已排队或正在进行；前端轮询 GET results 的 pending_mapping。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          mapping:
                            $ref: '#/components/schemas/TemplateMappingSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /ocr/jobs/{job_id}/use-generic:
    post:
      tags: [Templates]
      summary: 不套用模板（切回通用结果）
      description: |
        把当前版本切回通用结果最近保存的版本，并清除进行中的模板请求（pending）；已是通用结果时不新增结果版本。每次显式选择均记录 `template.generic_selected` 审计。不要求功能开关开启。
        错误：`expected_version` 不等于当前版本号 409 VERSION_CONFLICT；识别未成功 409 `results.not_ready`；已确认 409 `results.already_confirmed`；无通用结果 404。
      operationId: useGenericResult
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: OCR 任务 ID（32 位十六进制 UUID）。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UseGenericRequest'
      responses:
        '200':
          description: 切换后的当前结果。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ResultVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ===================== Exports (routes/exports.py) =====================
  /ocr/jobs/{job_id}/exports:
    post:
      tags: [Exports]
      summary: 创建结果导出
      description: |
        基于任务当前结果版本同步生成导出文件，创建即 READY，返回 201；有效期 24 小时。
        - 格式（大小写不敏感）：XLSX（全部单元格按字符串写入、保留前导零；结构化结果按“文档信息/表格”版式，分区标题语言取用户 language，th 或 en）、CSV（UTF-8 BOM）、TXT（结构化结果为缩进 JSON 文本，旧版为逐页文本）、JSON（当前 structured 原样输出，不替换键名或格式化值；application/json、.json 下载）。
        - 以 `=`、`+`、`-`、`@` 开头的单元格文本在 XLSX/CSV 中前置 `'` 防公式注入。
        - 模板结果（当前版本属于某个模板映射）：XLSX 标题为模板名称，按模板分组 / 字段 / 列的顺序与显示名称排版，金额类型字段按千分位两位小数显示；CSV 表头为 `section,name,value`，名称为「分组名 / 字段名」；模板外内容追加在对应分组末尾。通用结果的导出格式不变（CSV 表头 `section,path,value`）。
        - 任务非终态 → 409 STATE_CONFLICT `job.not_terminal`；无当前结果版本 → 404；format 非法 → 400（field=format, reason=invalid）。
        - 生成依赖缺失 → 503 EXPORT_UNAVAILABLE（`error.export_unavailable`）；生成/存储失败 → 导出记录置 FAILED，返回 503 EXPORT_FAILED（`error.export_failed`，retryable=true）。
      operationId: createExport
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: OCR 任务 ID（32 位十六进制 UUID）。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportCreateRequest'
      responses:
        '201':
          description: 导出已生成（status=READY）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExportJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /exports/{export_id}:
    get:
      tags: [Exports]
      summary: 查询导出
      description: |
        返回导出记录。对象级鉴权经所属任务校验（不可见 → 404）。
        READY 且已过 expires_at 时，记录被置为 EXPIRED 并返回 409 STATE_CONFLICT `export.expired`；之后再查询返回 200 且 status=EXPIRED。
      operationId: getExport
      security:
        - sessionCookie: []
      parameters:
        - name: export_id
          in: path
          required: true
          description: 导出 ID（32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '200':
          description: 导出记录。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /exports/{export_id}/download:
    get:
      tags: [Exports]
      summary: 下载导出文件
      description: |
        后端代理下发导出文件（需会话 Cookie 与对象级鉴权，无匿名/签名 URL），始终以附件形式返回。
        文件名：`<源文件名去扩展名>-v<result_version_id 前 8 位>.<xlsx|csv|txt>`（源文件缺失时用 job_id）。
        - 不可见 → 404；已过期 → 409 `export.expired`；状态非 READY 或对象不存在 → 409 `export.not_ready`。
      operationId: downloadExport
      security:
        - sessionCookie: []
      parameters:
        - name: export_id
          in: path
          required: true
          description: 导出 ID（32 位十六进制 UUID）。
          schema:
            type: string
      responses:
        '200':
          description: 导出文件字节。
          headers:
            Content-Disposition:
              description: 形如 `attachment; filename=...`（非 ASCII 文件名附带 `filename*=UTF-8''...`）。
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /enterprises:
    post:
      tags: [Enterprises]
      summary: 添加公司
      description: |
        创建公司，初始状态为 PENDING_VERIFICATION（待后台人工审核，审核通过后改为 VERIFIED 才生效）。
        系统自动生成公司编号 code（格式 `ent-YYMMDD-xxxxxx`，xxxxxx 为 6 位十六进制随机串），
        创建人自动成为该公司 ACTIVE 状态的 OWNER 成员（approved_via=CREATE）。
        字段先 trim 再校验；请求体非合法 JSON 时按空对象处理。
        校验失败返回 400 INVALID_ARGUMENT，field_errors 可能包含：
        `legal_name/required`（为空或超过 255 字符）、`registration_no/required`（为空或超过 64 字符）、
        `contact_phone/invalid`（超过 32 字符）、`cert_file_id/invalid`（文件不存在、非本人上传、
        purpose 不是 APPLICATION_MATERIAL 或 status 不是 READY）。
        写入审计事件 company.create。
      operationId: createEnterprise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnterpriseUpsertRequest'
      responses:
        '201':
          description: 创建成功，返回新公司（status=PENDING_VERIFICATION）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [enterprise]
                        properties:
                          enterprise:
                            $ref: '#/components/schemas/Enterprise'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - sessionCookie: []
          csrfHeader: []

  /enterprises/mine:
    get:
      tags: [Enterprises]
      summary: 我的公司列表
      description: |
        返回当前用户成员关系状态为 PENDING 或 ACTIVE 的所有公司（自己创建的或已绑定/已申请的，含待审核公司），
        按公司创建时间倒序。每项为公司信息加上我的角色 my_role 与我的成员状态 membership_status。
        不分页。
      operationId: listMyEnterprises
      responses:
        '200':
          description: 我的公司列表。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/MyCompany'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - sessionCookie: []

  /enterprises/{enterprise_id}:
    patch:
      tags: [Enterprises]
      summary: 修改公司信息
      description: |
        仅该公司 ACTIVE 状态的 OWNER 可修改。请求体与添加公司相同，legal_name 与 registration_no
        必须完整提交（整体覆盖 legal_name / registration_no / contact_phone；contact_phone 未提供则置为空串）。
        cert_file_id 为空或未提供时保留原证明材料。
        若公司当前为 VERIFIED，修改后自动回到 PENDING_VERIFICATION 需重新审核；其他状态保持不变。
        公司不存在返回 404 RESOURCE_NOT_FOUND；非 ACTIVE OWNER 返回 403 PERMISSION_DENIED（先于参数校验）；
        参数校验规则与 field_errors 同添加公司。写入审计事件 company.update。
      operationId: updateEnterprise
      parameters:
        - name: enterprise_id
          in: path
          required: true
          description: 公司 ID（enterprises.id）。
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnterpriseUpsertRequest'
      responses:
        '200':
          description: 修改成功，返回最新公司信息。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [enterprise]
                        properties:
                          enterprise:
                            $ref: '#/components/schemas/Enterprise'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - sessionCookie: []
          csrfHeader: []

  /enterprises/bind:
    post:
      tags: [Enterprises]
      summary: 按公司编号绑定公司
      description: |
        按公司编号 code（enterprises.code，如 `ent-261018-a1b2c3`）绑定已生效（VERIFIED）公司，
        绑定后立即成为 ACTIVE 成员（approved_via=BIND）。一人可绑定多个公司；此前已解绑（LEFT）
        可重新绑定，并沿用原角色。服务端仅校验 code 非空（trim 后），不校验格式。
        错误：code 为空返回 400（field_errors `code/required`）；公司不存在或未审核通过统一返回
        404 RESOURCE_NOT_FOUND（不区分）；已是 ACTIVE/PENDING 成员返回 409 STATE_CONFLICT
        `membership.already_member`；成员关系为 REJECTED/REMOVED 返回 409 `membership.rejoin_forbidden`。
        成功后写审计 company.bind，并给本人发送 MEMBERSHIP_ACTIVE 通知。
      operationId: bindEnterprise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnterpriseBindRequest'
      responses:
        '200':
          description: 绑定成功，返回公司信息与我的角色。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EnterpriseJoinResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - sessionCookie: []
          csrfHeader: []

  /enterprises/{enterprise_id}/unbind:
    post:
      tags: [Enterprises]
      summary: 解绑公司
      description: |
        将当前用户在该公司的成员关系（ACTIVE 或 PENDING）置为 LEFT 并记录 revoked_at；
        成员关系记录保留，但不再是有效身份。任何角色（含 OWNER）均可解绑。无需请求体。
        当前用户在该公司无 ACTIVE/PENDING 成员关系时返回 404 RESOURCE_NOT_FOUND。
        写入审计事件 company.unbind。
      operationId: unbindEnterprise
      parameters:
        - name: enterprise_id
          in: path
          required: true
          description: 公司 ID（enterprises.id）。
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 解绑成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EnterpriseUnbindResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - sessionCookie: []
          csrfHeader: []

  /enterprises/{enterprise_id}/membership-applications:
    post:
      tags: [Applications]
      summary: 提交入企申请
      description: |
        向已生效（VERIFIED）公司提交入企申请：创建 type=MEMBERSHIP、status=SUBMITTED 的申请单，
        并为申请人建立 PENDING 成员关系（role=MEMBER，approved_via=APPLICATION）；此前为 LEFT 的成员关系
        改回 PENDING。表单快照 form 记录 message 与公司编号 enterprise_code。
        错误：公司不存在或未 VERIFIED 返回 404 RESOURCE_NOT_FOUND；message 超过 500 字符返回 400
        （field_errors `message/too_long`）；已是 PENDING/ACTIVE 成员返回 409 STATE_CONFLICT
        `application.duplicate_open`；成员关系为 REJECTED/REMOVED 返回 409 `membership.rejoin_forbidden`。
        写入审计事件 application.submit。
      operationId: submitMembershipApplication
      parameters:
        - name: enterprise_id
          in: path
          required: true
          description: 目标公司 ID（enterprises.id）。
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipApplicationRequest'
      responses:
        '201':
          description: 申请已提交，返回申请单。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MembershipApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - sessionCookie: []
          csrfHeader: []

  /enterprises/{enterprise_id}/invitations:
    post:
      tags: [Applications]
      summary: 创建邀请
      description: |
        仅该公司 ACTIVE 状态的 OWNER 或 ADMIN 可创建一次性邀请令牌。令牌明文只在本响应中返回一次，
        服务端仅保存其 SHA-256 哈希。创建时不校验公司审核状态（兑换时才要求 VERIFIED）。
        错误：公司不存在返回 404 RESOURCE_NOT_FOUND；非 ACTIVE OWNER/ADMIN 返回 403 PERMISSION_DENIED；
        max_uses 非 1–100 的整数返回 400（field_errors `max_uses/invalid`）；ttl_hours 非 1–720 的整数返回 400
        （field_errors `ttl_hours/invalid`）。布尔值、浮点数、字符串或显式 null 均视为非法。
        写入审计事件 invitation.create。
      operationId: createInvitation
      parameters:
        - name: enterprise_id
          in: path
          required: true
          description: 公司 ID（enterprises.id）。
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreateRequest'
      responses:
        '201':
          description: 邀请已创建，返回令牌明文（仅此一次）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - sessionCookie: []
          csrfHeader: []

  /invitations/redeem:
    post:
      tags: [Applications]
      summary: 兑换邀请
      description: |
        已登录用户凭邀请令牌加入公司，成功后成为 ACTIVE 成员（approved_via=INVITATION；此前为 LEFT 则恢复并沿用原角色），
        邀请 use_count 加 1，达到 max_uses 时邀请置为 EXPIRED。令牌会先 trim 再计算哈希匹配。
        错误：token 缺失、非字符串或超过 128 字符返回 400（field_errors `token/required`）；
        令牌不存在或邀请非 ACTIVE 统一返回 404 RESOURCE_NOT_FOUND（防枚举）；
        409 STATE_CONFLICT 的 message_key：`invitation.expired`（已过期，同时置为 EXPIRED）、
        `invitation.exhausted`（次数用尽）、`invitation.enterprise_unavailable`（公司不存在或未 VERIFIED）、
        `membership.already_member`（已是 ACTIVE/PENDING 成员）、`membership.rejoin_forbidden`（成员关系为 REJECTED/REMOVED）。
        成功后写审计 invitation.redeem，并给本人发送 MEMBERSHIP_ACTIVE 通知。
      operationId: redeemInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRedeemRequest'
      responses:
        '200':
          description: 兑换成功，返回公司信息与我的角色。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EnterpriseJoinResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - sessionCookie: []
          csrfHeader: []

  /invitations/{invitation_id}:
    delete:
      tags: [Applications]
      summary: 撤销邀请
      description: |
        将 ACTIVE 邀请置为 REVOKED。邀请创建人或该公司 OWNER/ADMIN 可撤销。
        错误：邀请不存在返回 404 RESOURCE_NOT_FOUND；无权限返回 403 PERMISSION_DENIED；
        邀请已非 ACTIVE（已撤销/已过期）返回 409 STATE_CONFLICT `invitation.not_active`。
        写入审计事件 invitation.revoke。
      operationId: revokeInvitation
      parameters:
        - name: invitation_id
          in: path
          required: true
          description: 邀请 ID（invitations.id）。
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 撤销成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/InvitationRevokeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - sessionCookie: []
          csrfHeader: []

  /health:
    get:
      tags: [Ops]
      summary: 健康检查
      description: 非版本化运维端点，实际路径为 `/api/health`，无需登录。`vendor` 表示 TextIn 客户端是否已配置。
      operationId: getHealth
      security: []
      servers:
        - url: /api
      responses:
        '200':
          description: 服务存活
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, vendor]
                properties:
                  ok:
                    type: boolean
                    example: true
                  service:
                    type: string
                    example: saiflow-api
                  vendor:
                    type: string
                    enum: [textin, unconfigured]
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: saiflow_session
      description: 登录 / 游客会话 Cookie（HttpOnly，path=/api），由 `POST /auth/line` 或 `POST /auth/guest` 下发。
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 写请求（POST/PUT/PATCH/DELETE）必带；值为登录或 `GET /auth/session` 返回的 `csrf_token`。
  responses:
    BadRequest:
      description: 参数校验失败（INVALID_ARGUMENT）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_ARGUMENT
            message_key: error.invalid_argument
            request_id: 3f9c2a1b7d4e5f60
            retryable: false
            field_errors:
              - field: legal_name
                reason: required
    Unauthorized:
      description: 未登录或会话无效（AUTH_REQUIRED / SESSION_EXPIRED / SESSION_REVOKED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_REQUIRED
            message_key: auth.login_required
            request_id: 3f9c2a1b7d4e5f60
            retryable: false
            field_errors: []
    PaymentRequired:
      description: |
        需要付费才能继续（402）。两种互斥语义：
        - `PLAN_EXPIRED` / `plan.expired`：订阅已到期或尚未开通（企业未认证），新建 OCR 任务被硬停；
        - `QUOTA_EXCEEDED` / `quota.exceeded`：订阅仍 ACTIVE，但本月页数（OCR_PAGE）已用尽。
        两种情况下历史任务、结果与导出均不受影响。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PLAN_EXPIRED
            message_key: plan.expired
            request_id: 3f9c2a1b7d4e5f60
            retryable: false
            field_errors: []
    Forbidden:
      description: 无权限（ACCOUNT_DISABLED / PERMISSION_DENIED / CSRF_INVALID / ENTERPRISE_ACCESS_REVOKED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: CSRF_INVALID
            message_key: error.csrf_invalid
            request_id: 3f9c2a1b7d4e5f60
            retryable: false
            field_errors: []
    NotFound:
      description: 资源不存在或无权访问（RESOURCE_NOT_FOUND）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESOURCE_NOT_FOUND
            message_key: error.not_found
            request_id: 3f9c2a1b7d4e5f60
            retryable: false
            field_errors: []
    Conflict:
      description: 状态冲突（STATE_CONFLICT / VERSION_CONFLICT）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: STATE_CONFLICT
            message_key: error.state_conflict
            request_id: 3f9c2a1b7d4e5f60
            retryable: false
            field_errors: []
    UnprocessableEntity:
      description: 模板结果确认时必填字段缺失（INVALID_ARGUMENT / results.required_missing），未写入任何内容
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_ARGUMENT
            message_key: results.required_missing
            request_id: 3f9c2a1b7d4e5f60
            retryable: false
            field_errors:
              - field: structured.summary.net_total
                reason: required
    TooManyRequests:
      description: 请求过于频繁（RATE_LIMITED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMITED
            message_key: error.rate_limited
            request_id: 3f9c2a1b7d4e5f60
            retryable: true
            field_errors: []
    ServiceUnavailable:
      description: 依赖服务不可用（SERVICE_UNAVAILABLE / AUTH_SERVICE_UNAVAILABLE / OCR_VENDOR_UNAVAILABLE / EMAIL_SERVICE_UNAVAILABLE / STORAGE_UNAVAILABLE / EXPORT_UNAVAILABLE / EXPORT_FAILED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SERVICE_UNAVAILABLE
            message_key: error.service_unavailable
            request_id: 3f9c2a1b7d4e5f60
            retryable: true
            field_errors: []
  schemas:
    OkEnvelope:
      type: object
      description: 成功响应外层；各接口用 allOf 收窄 `data` 的结构。
      required: [code, data]
      properties:
        code:
          type: string
          enum: [OK]
        data:
          description: 业务数据（无返回内容时为空对象）
    Error:
      type: object
      description: 统一错误响应。
      required: [code, message_key, request_id, retryable, field_errors]
      properties:
        code:
          type: string
          description: 机器可读错误码
          enum:
            - INVALID_ARGUMENT
            - AUTH_REQUIRED
            - SESSION_EXPIRED
            - SESSION_REVOKED
            - PLAN_EXPIRED
            - QUOTA_EXCEEDED
            - ACCOUNT_DISABLED
            - PERMISSION_DENIED
            - CSRF_INVALID
            - ENTERPRISE_ACCESS_REVOKED
            - RESOURCE_NOT_FOUND
            - STATE_CONFLICT
            - VERSION_CONFLICT
            - RATE_LIMITED
            - SERVICE_UNAVAILABLE
            - AUTH_SERVICE_UNAVAILABLE
            - OCR_VENDOR_UNAVAILABLE
            - EMAIL_SERVICE_UNAVAILABLE
            - STORAGE_UNAVAILABLE
            - EXPORT_UNAVAILABLE
            - EXPORT_FAILED
        message_key:
          type: string
          description: 前端 i18n 文案键
          example: error.not_found
        request_id:
          type: string
          description: 请求追踪 ID（16 位十六进制）
        retryable:
          type: boolean
          description: 是否可重试
        field_errors:
          type: array
          description: |
            字段级校验错误（仅 INVALID_ARGUMENT 时可能非空）。两种形态并存，取决于路由：
            `{field, reason}`（如 plans / ocr / files 的参数校验）或 `{field, message_key}`（如 /me 下的资料校验）。
          items:
            type: object
            required: [field]
            properties:
              field:
                type: string
                example: legal_name
              reason:
                type: string
                description: 原因代码，如 required / invalid / too_long
                example: required
              message_key:
                type: string
                description: 前端 i18n 文案键，如 error.phone_invalid / error.field_required
                example: error.phone_invalid

    AuthLineRequest:
      type: object
      description: id_token 与 dev_id 至少提供其一；dev_id 仅在 AUTH_DEV_MODE 开启且 id_token 为空时生效
      properties:
        id_token:
          type: string
          description: LINE LIFF/Login 获取的 ID token（去除首尾空白）
        dev_id:
          type: string
          maxLength: 64
          description: 开发兜底身份标识（仅 AUTH_DEV_MODE），映射为 line_sub=dev:<dev_id>
        language:
          type: string
          enum: [th, en]
          description: 界面语言；非 th/en 时忽略

    User:
      type: object
      required: [id, display_name, avatar_url, language, status, is_guest, phone, email, registered, created_at]
      properties:
        id:
          type: integer
          format: int64
        display_name:
          type: string
          maxLength: 128
        avatar_url:
          type: string
          description: 头像地址；已转存时为 `/api/v1/me/avatar?v=<版本>`，否则为外部 https URL（LINE），无头像为空串
        language:
          type: string
          enum: [th, en]
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        is_guest:
          type: boolean
          description: 是否游客账号
        phone:
          type: string
          maxLength: 32
          description: 默认 LINE 返回值，注册时与个人中心（PATCH /me）均可修改；可能为空串
        email:
          type: string
          maxLength: 254
          description: 可能为空串
        registered:
          type: boolean
          description: 是否已完成注册信息录入
        created_at:
          type: string
          format: date-time
          nullable: true
          description: UTC ISO 8601（无时区后缀）

    Tenant:
      type: object
      description: 有效身份（租户）列表项（workspace.list_tenants）。
      required: [tenant_id, tenant_type, name, role]
      properties:
        tenant_id:
          type: integer
          format: int64
          description: 租户 ID（`tenants.id`），业务归属的唯一标识
        tenant_type:
          type: string
          enum: [PERSONAL, ENTERPRISE]
        name:
          type: string
          nullable: true
          description: 企业法定名称（enterprises.legal_name）；个人租户为 null
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
          nullable: true
          description: 本人在该企业租户中的角色；个人租户为 null

    AuthPayload:
      type: object
      required: [user, csrf_token, tenants]
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
          description: 明文 CSRF token，写请求需放入 X-CSRF-Token 请求头
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'

    AuthSessionPayload:
      allOf:
        - $ref: '#/components/schemas/AuthPayload'
        - type: object
          required: [issued_at, absolute_expires_at]
          properties:
            issued_at:
              type: string
              format: date-time
              nullable: true
              description: 会话签发时间（UTC，无时区后缀）
            absolute_expires_at:
              type: string
              format: date-time
              nullable: true
              description: 会话绝对过期时间（UTC，无时区后缀）

    UpdateMeRequest:
      type: object
      description: 仅出现的字段会被更新
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
          description: 去除首尾空白后校验
        phone:
          type: string
          maxLength: 32
          description: |
            个人中心可修改（FR-SYS-015）。空串清空；否则去空白后 ≤32 字符，只允许 `+`、数字、空格、
            `(`、`)`、`.`、`-`，剔除非数字后须为 6–15 位数字。游客不可修改（403）。
        language:
          type: string
          enum: [th, en]
        avatar_url:
          type: string
          description: |
            与当前头像地址相同=不变；空串=清除；https URL（≤1024 字符）=外部引用；
            或 data URL `data:image/(png|jpeg|webp);base64,...`（解码后 ≤300 KB，文件头须与类型一致）。游客不可修改。

    RegistrationRequest:
      type: object
      required: [display_name, email, code]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        phone:
          type: string
          maxLength: 32
          description: 注册时可编辑；空串可清空，省略保留 LINE 默认值；非空时需 6–15 位数字及常用电话格式
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          description: 6 位数字邮箱验证码；10 分钟内有效且仅用一次（显式本地 AUTH_DEV_MODE 下仅要求非空）
        avatar_url:
          type: string
          description: 可选，规则同 UpdateMeRequest.avatar_url

    QuotaTenant:
      type: object
      description: 单个租户的额度与订阅视图（quota.quota_summary）。
      required: [tenant_id, tenant_type, name, plan, subscription, pages]
      properties:
        tenant_id:
          type: integer
          format: int64
        tenant_type:
          type: string
          enum: [PERSONAL, ENTERPRISE]
        name:
          type: string
          nullable: true
          description: 企业法定名称；个人租户为 null
        plan:
          type: object
          required: [code, name, name_i18n, is_paid, source, metering]
          properties:
            code:
              type: string
              nullable: true
              description: 无订阅（企业未认证）时为 null；不存在 FREE 档位。套餐代码，取自 `plans` 配置表（FR-SYS-019），当前为 KINDER / STARTER / INTERMEDIATE / ADVANCE；可新增，客户端不得写死枚举。
            name:
              type: string
              nullable: true
              description: 英文名称
            name_i18n:
              type: object
              nullable: true
              description: 套餐名称双语（FR-SYS-019）；无订阅时为 null
              properties:
                en:
                  type: string
                th:
                  type: string
            is_paid:
              type: boolean
              description: 仅 source=APPROVED 为 true；系统默认开通的默认套餐（当前一个月 Kinder）为 false，ACTIVE 不代表已付款。
            source:
              type: string
              nullable: true
              enum: [DEFAULT, APPROVED, null]
              description: DEFAULT=系统默认开通（时长取默认套餐的 trial_months，当前一个月）/ APPROVED=人工审批续费 / null=无订阅。
            metering:
              type: string
              enum: [OCR_PAGE]
              description: 唯一计量单位：每月页数。没有赠送任务额度，也没有第二种计量。
        subscription:
          type: object
          required: [status, starts_at, expires_at, days_remaining]
          properties:
            status:
              type: string
              enum: [ACTIVE, EXPIRED, NONE]
              description: ACTIVE=有效期内 / EXPIRED=已到期（新建任务 402 plan.expired）/ NONE=企业未认证，无订阅行。
            starts_at:
              type: string
              format: date-time
              nullable: true
              description: 本期生效时间（UTC，无时区后缀）；NONE 时为 null
            expires_at:
              type: string
              format: date-time
              nullable: true
              description: 本期到期时间（UTC，无时区后缀）；NONE 时为 null
            days_remaining:
              type: integer
              nullable: true
              description: 剩余泰国时区自然日：0=今天到期，负数=已过期；NONE 时为 null
        pages:
          type: object
          required: [monthly_total, remaining]
          description: |
            本月页数权益与剩余（泰国时间 UTC+7 自然月，按 `ocr_jobs.page_count` 实时统计，FAILED/CANCELLED 不计）。
            订阅非 ACTIVE 时 `remaining` 恒为 0（`monthly_total` 为该档目录值，无订阅时为 0）。
          properties:
            monthly_total:
              type: integer
            remaining:
              type: integer
              minimum: 0

    PendingApplicationBrief:
      type: object
      required: [id, type, status]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [ENTERPRISE_VERIFICATION, MEMBERSHIP, PLAN_UPGRADE]
        status:
          type: string
          enum: [DRAFT, SUBMITTED, UNDER_REVIEW, NEEDS_INFO]

    UserApplication:
      type: object
      required: [id, type, status, form, version, review_note, target_tenant_id, submitted_at, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [ENTERPRISE_VERIFICATION, MEMBERSHIP, PLAN_UPGRADE]
        status:
          type: string
          enum: [DRAFT, SUBMITTED, UNDER_REVIEW, NEEDS_INFO, APPROVED, REJECTED, WITHDRAWN]
        form:
          type: object
          additionalProperties: true
          description: >-
            表单快照（结构随 type 而异）。PLAN_UPGRADE 含 plan_code/plan_name/tenant_id/tenant_type，
            以及提交时为空串的 valid_from / valid_to——运营审批时填入有效期（`YYYY-MM-DD` 或 ISO 时间），
            也可用 period_months（1~120 的整数）代替 valid_to；两者皆空则按默认 12 个月续期。
        version:
          type: integer
          description: 乐观并发版本号
        review_note:
          type: string
          maxLength: 512
        target_tenant_id:
          type: integer
          format: int64
          description: 申请指向的租户（个人或企业租户）ID。
        submitted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    Notification:
      type: object
      required: [id, type, title, body, read, created_at]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          maxLength: 32
          enum:
            - PLAN_EXPIRING
            - PLAN_EXPIRED
            - PLAN_UPGRADE_SUBMITTED
            - PLAN_UPGRADE_APPROVED
            - PLAN_UPGRADE_REJECTED
            - ACCOUNT_ACTIVATED
            - COMPANY_ACTIVATED
            - MEMBERSHIP_ACTIVE
          description: >-
            账户变动类通知类型：PLAN_EXPIRING（到期前 D7/D3/D1/D0 提醒）、PLAN_EXPIRED（到期后提醒）、
            PLAN_UPGRADE_SUBMITTED / PLAN_UPGRADE_APPROVED / PLAN_UPGRADE_REJECTED（升级申请提交/批准/拒绝）、
            ACCOUNT_ACTIVATED（个人账户首次开通 Kinder，游客不发）、COMPANY_ACTIVATED（公司认证后首次开通，
            发给 ACTIVE OWNER）、MEMBERSHIP_ACTIVE（加入公司）。
        title:
          type: string
          maxLength: 128
        body:
          type: string
          maxLength: 512
        read:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true

    ActivityEvent:
      type: object
      required: [action, object_type, object_id, created_at]
      properties:
        action:
          type: string
          maxLength: 64
          description: 审计动作，如 me.update、user.register、plan_application.submit
        object_type:
          type: string
          maxLength: 32
        object_id:
          type: string
          maxLength: 64
        created_at:
          type: string
          format: date-time
          nullable: true

    DataRequest:
      type: object
      required: [id, kind, status, created_at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [ACCESS, DELETION]
        status:
          type: string
          enum: [PENDING, DONE, REJECTED]
        created_at:
          type: string
          format: date-time
          nullable: true

    Plan:
      type: object
      required: [code, name, price, quota_pages_per_month, seats, features, theme, is_default, i18n]
      properties:
        code:
          type: string
          description: 套餐代码，取自 `plans` 配置表（FR-SYS-019），当前为 KINDER / STARTER / INTERMEDIATE / ADVANCE；可新增，客户端不得写死枚举。
        name:
          type: string
          description: 英文名称（其他语言见 i18n）
        price:
          type: object
          required: [monthly_thb, yearly_thb, display]
          properties:
            monthly_thb:
              type: integer
              nullable: true
              description: 月付价格（THB）；不提供时为 null
            yearly_thb:
              type: integer
              nullable: true
              description: 年付价格（THB）；不提供时为 null
            display:
              type: string
              description: 英文展示文案，如 "THB 888 / year"、"Contact us"（其他语言见 i18n）
        quota_pages_per_month:
          type: integer
          description: 每月可识别页数（配置值，修改后对存量订阅即时生效）
        seats:
          type: integer
        features:
          type: array
          description: 英文卖点列表（其他语言见 i18n）
          items:
            type: string
        theme:
          type: string
          enum: [DEFAULT, DARK]
          description: 卡片样式；DARK=深色强调卡
        is_default:
          type: boolean
          description: 是否默认开通套餐（新租户/企业认证后自动开通；目录中恰好一个）
        i18n:
          type: object
          description: 双语展示文案（FR-SYS-019），键为语言代码
          required: [en, th]
          properties:
            en:
              $ref: '#/components/schemas/PlanText'
            th:
              $ref: '#/components/schemas/PlanText'

    PlanText:
      type: object
      required: [name, price_display, features]
      properties:
        name:
          type: string
        price_display:
          type: string
        features:
          type: array
          items:
            type: string

    SubscriptionBrief:
      type: object
      required: [plan_code, plan_name, application_id, submitted_at]
      properties:
        plan_code:
          type: string
          nullable: true
          description: 套餐代码，取自 `plans` 配置表（FR-SYS-019），当前为 KINDER / STARTER / INTERMEDIATE / ADVANCE；可新增，客户端不得写死枚举。
        plan_name:
          type: string
          nullable: true
        application_id:
          type: integer
          format: int64
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true

    Subscription:
      type: object
      description: >-
        单个租户的订阅状态（subscriptions.state 加上 tenant_id / tenant_type / can_manage）。
        每个租户最多一行订阅：个人租户（含游客）在首次登录时从 tenants.created_at 起自动开通一个月 Kinder（source=DEFAULT）；
        企业租户从 enterprises.verified_at 起开通，未通过认证时没有订阅行，status 为 NONE。
        运营批准 PLAN_UPGRADE 申请后惰性同步为 source=APPROVED。
      required: [status, plan_code, plan_name, source, application_id, starts_at, expires_at, days_remaining, pending, tenant_id, tenant_type, can_manage]
      properties:
        status:
          type: string
          enum: [ACTIVE, EXPIRED, NONE]
          description: expires_at 晚于当前时间为 ACTIVE，否则 EXPIRED；没有订阅行（企业未认证）为 NONE。
        plan_code:
          type: string
          nullable: true
          description: NONE 时为 null。套餐代码，取自 `plans` 配置表（FR-SYS-019），当前为 KINDER / STARTER / INTERMEDIATE / ADVANCE；可新增，客户端不得写死枚举。
        plan_name:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
          enum: [DEFAULT, APPROVED, null]
          description: DEFAULT 为系统默认开通的默认套餐区间（当前一个月 Kinder）；APPROVED 为运营批准申请后生成的区间；NONE 时为 null。
        application_id:
          type: integer
          format: int64
          nullable: true
          description: 生成当前区间的申请 ID；DEFAULT 与 NONE 时为 null。
        starts_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 按自然月推进并做月末夹取（2026-01-31 + 1 个月 = 2026-02-28）。
        days_remaining:
          type: integer
          nullable: true
          description: 按泰国时区（UTC+7）日历日计算；0 表示当天到期，负数表示已过期；NONE 时为 null。
        pending:
          allOf:
            - $ref: '#/components/schemas/SubscriptionBrief'
          nullable: true
          description: 处理中的 PLAN_UPGRADE 申请（SUBMITTED/UNDER_REVIEW/NEEDS_INFO）；无则 null。
        tenant_id:
          type: integer
          format: int64
        tenant_type:
          type: string
          enum: [PERSONAL, ENTERPRISE]
        can_manage:
          type: boolean
          description: 当前用户能否为该租户提交套餐申请（个人租户 true；企业租户仅 OWNER）。

    PlanApplicationRequest:
      type: object
      required: [plan_code]
      properties:
        plan_code:
          type: string
          description: 目标套餐代码，须为启用中的套餐（停用或不存在返回 400 INVALID_ARGUMENT）
        tenant_id:
          type: integer
          format: int64
          nullable: true
          description: >-
            目标租户 ID；省略或为空时默认调用者本人的个人租户。必须为 JSON 整数（布尔/字符串均按
            400 INVALID_ARGUMENT + field_errors[{field: tenant_id, reason: invalid}] 拒绝）。

    # ---------- Files ----------
    FileObject:
      type: object
      description: 文件对象（File.to_dict）。时间为 UTC ISO 8601，无时区后缀。
      properties:
        id:
          type: string
          description: 文件 ID（32 位十六进制）。
          example: 3f2b9c0e8a1d4e6f9b7c5a3d2e1f0a9b
        tenant_id:
          type: integer
          format: int64
          description: 文件归属租户 ID（个人或企业租户）。
        purpose:
          type: string
          enum: [OCR_TASK, APPLICATION_MATERIAL]
        original_name:
          type: string
          maxLength: 255
          description: 净化后的原始文件名。
        mime_type:
          type: string
          description: image/jpeg、image/png、application/pdf；扩展名不受支持时为空串。
        size_bytes:
          type: integer
          description: 字节数（内容上传前为 0）。
        page_count:
          type: integer
          description: 页数（complete 校验前为 0；图片为 1）。
        sha256:
          type: string
          description: 内容 SHA-256 十六进制摘要（内容上传前为空串）。
        status:
          type: string
          enum: [UPLOADING, UPLOADED, VALIDATING, READY, REJECTED]
        reject_reason:
          type: string
          description: 拒绝原因 message_key（如 files.too_large、files.disguised_type、files.too_many_pages、files.invalid、files.corrupt_or_encrypted）；未拒绝为空串。
        created_at:
          type: string
          nullable: true
          example: '2026-10-18T03:21:45.123456'
    FilePayload:
      type: object
      properties:
        file:
          $ref: '#/components/schemas/FileObject'
    UploadCreateRequest:
      type: object
      required: [file_name]
      properties:
        file_name:
          type: string
          description: 原始文件名；扩展名须为 jpg/jpeg/png/pdf（大小写不敏感），净化后截断至 255 字符。
          example: invoice-2026-10.pdf
        size_bytes:
          type: integer
          maximum: 20971520
          description: 可选，声明的文件大小；超过 20MB 直接拒绝。
        purpose:
          type: string
          enum: [OCR_TASK, APPLICATION_MATERIAL]
          default: OCR_TASK
        tenant_id:
          type: integer
          format: int64
          nullable: true
          description: >-
            归属租户 ID；省略或为空时默认调用者本人的个人租户。无法解析或不可见时返回
            400 INVALID_ARGUMENT（error.invalid_workspace）。
    UploadSession:
      type: object
      properties:
        upload_id:
          type: string
          description: 上传会话 ID，与 file.id 相同；用于后续 PUT content / POST complete。
        file:
          $ref: '#/components/schemas/FileObject'
    UploadContentResult:
      type: object
      properties:
        file_id:
          type: string
        size_bytes:
          type: integer
        sha256:
          type: string
    FileImportRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: http 或 https 公网地址。
          example: https://example.com/docs/po-001.pdf
        tenant_id:
          type: integer
          format: int64
          nullable: true
          description: 归属租户 ID；省略或为空时默认调用者本人的个人租户。

    # ---------- OCR ----------
    OcrCapabilities:
      type: object
      properties:
        vendor:
          type: string
          enum: [textin]
        features:
          type: object
          properties:
            table:
              type: boolean
              example: true
            formula:
              type: boolean
              example: true
            rotate:
              type: boolean
              example: true
            fields:
              type: boolean
              example: true
            parse_modes:
              type: array
              items:
                type: string
              example: [scan, layout, article]
        limits:
          type: object
          properties:
            allowed_extensions:
              type: array
              items:
                type: string
              example: [jpeg, jpg, pdf, png]
            max_file_size_bytes:
              type: integer
              example: 20971520
            max_pages_per_task:
              type: integer
              example: 50
            max_images_per_task:
              type: integer
              example: 10
            max_images_total_bytes:
              type: integer
              example: 52428800
    OcrJobParams:
      type: object
      description: OCR 参数。仅以下键会被保存；parse_mode/table/formula/rotate 服务端不校验取值，原样保存。
      properties:
        parse_mode:
          type: string
          description: 解析模式，能力接口给出 scan / layout / article。
        table:
          type: boolean
        formula:
          type: boolean
        rotate:
          type: boolean
        page:
          type: integer
          minimum: 0
          description: 起始页偏移（0 起；实际起始页 = page + 1）。
        page_count:
          type: integer
          minimum: 1
          maximum: 50
          description: 识别页数；缺省为 min(文件页数, 50)。
    OcrJobCreateRequest:
      type: object
      required: [file_id]
      properties:
        file_id:
          type: string
          description: READY 且 purpose=OCR_TASK 的文件 ID。
        params:
          $ref: '#/components/schemas/OcrJobParams'
        field_names:
          type: array
          maxItems: 100
          description: 需抽取的字段名列表；每项为非空白字符串且长度 ≤ 64，保存前去首尾空白。
          items:
            type: string
            minLength: 1
            maxLength: 64
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          description: 幂等键（Idempotency-Key 请求头缺省时使用）。
    OcrJobSummary:
      type: object
      description: OCR 任务摘要（OcrJob.to_summary）。时间为 UTC ISO 8601，无时区后缀。
      properties:
        id:
          type: string
        tenant_id:
          type: integer
          format: int64
          description: 任务归属租户 ID（继承源文件的 tenant_id）。
        file_id:
          type: string
        file_name:
          type: string
          description: 源文件 original_name（文件缺失时为空串）。
        status:
          type: string
          enum: [QUEUED, PREPROCESSING, PROCESSING, POSTPROCESSING, SUCCEEDED, PARTIAL_SUCCESS, FAILED, CANCEL_REQUESTED, CANCELLED]
        progress:
          type: integer
          description: 进度（0~100）。
        page_count:
          type: integer
        table_count:
          type: integer
        field_count:
          type: integer
        duration_ms:
          type: integer
        review_status:
          type: string
          enum: [UNREVIEWED, EDITED, CONFIRMED]
        stage:
          type: string
          enum: [OCR_PROCESSING, OCR_FAILED, TEMPLATE_MATCHING, VERIFYING, VERIFIED, COMPLETED]
          description: |
            流程阶段：FAILED/CANCELLED → OCR_FAILED；其余非成功状态 → OCR_PROCESSING；成功（SUCCEEDED/PARTIAL_SUCCESS）未确认且存在进行中的模板映射（pending_mapping_id 非空）→ TEMPLATE_MATCHING；成功未确认且无进行中的映射 → VERIFYING；历史已确认且 completed_at 为空 → VERIFIED（注册后显式 confirm 可完成）；已确认且 completed_at 非空 → COMPLETED。新确认请求必须先登录注册。
        error_code:
          type: string
          description: 失败时的错误码，否则为空串。
        error_message:
          type: string
        parent_job_id:
          type: string
          nullable: true
          description: 由 rerun 产生时指向原任务。
        template_name:
          type: string
          nullable: true
          description: 当前结果所套用模板的显示名称；通用结果为 null。
        created_at:
          type: string
          nullable: true
        finished_at:
          type: string
          nullable: true
    OcrJobPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OcrJobSummary'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    OcrJobResultsDeleted:
      type: object
      properties:
        id:
          type: string
          description: 任务 ID。
        results_deleted:
          type: boolean
          enum: [true]

    # ---------- Results ----------
    ResultCell:
      type: object
      description: 旧版逐页结果的表格单元格。
      properties:
        row_index:
          type: integer
          minimum: 0
        column_index:
          type: integer
          minimum: 0
        row_span:
          type: integer
        column_span:
          type: integer
        raw_text:
          type: string
          description: OCR 原始文本（编辑后保留）。
        current_text:
          type: string
          description: 当前文本（可编辑）。
        polygon:
          type: array
          items: {}
          description: 厂商返回的坐标。
        confidence:
          type: number
        review_status:
          type: string
          enum: [UNREVIEWED, EDITED, CONFIRMED]
    ResultTable:
      type: object
      properties:
        table_id:
          type: string
          example: table_1
        row_count:
          type: integer
        column_count:
          type: integer
        cells:
          type: array
          items:
            $ref: '#/components/schemas/ResultCell'
    ResultField:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        source:
          type: string
        source_page:
          type: integer
    ResultPage:
      type: object
      description: 旧版逐页结果。
      properties:
        page_number:
          type: integer
          description: 原始页码（1 起）。
        text:
          type: string
        tables:
          type: array
          items:
            $ref: '#/components/schemas/ResultTable'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ResultField'
    ResultVersion:
      type: object
      description: 任务当前结果版本视图。
      properties:
        job_id:
          type: string
        version:
          type: integer
          description: 当前版本号；新内容版本取整个任务 max(version)+1，切回已有分支可返回旧号。PATCH 时作为 expected_version。
        review_status:
          type: string
          enum: [UNREVIEWED, EDITED, CONFIRMED]
        page_count:
          type: integer
        table_count:
          type: integer
        field_count:
          type: integer
        missing_pages:
          type: array
          description: PARTIAL_SUCCESS 时缺失的页码。
          items:
            type: integer
        structured:
          description: |
            结构化结果（任意 JSON 对象或数组，保留键顺序）。TextIn Prompt 任务为结构化 JSON；旧版逐页结果折算为 `{fields: {名称: 值}, tables: [[[单元格文本]]]}`。
        pages:
          type: array
          description: 旧版逐页数据；TextIn Prompt 任务为空数组。
          items:
            $ref: '#/components/schemas/ResultPage'
        raw_result_id:
          type: string
          nullable: true
          description: 该任务的 OCR 解析结果 ID（套用模板时回传）；开关关闭时新任务仍保存，只有无原始快照的历史任务为 null。
        current_mapping:
          allOf:
            - $ref: '#/components/schemas/TemplateMappingSummary'
          nullable: true
          description: 当前版本所属的模板映射；通用结果为 null。
        template_schema:
          type: object
          nullable: true
          description: 当前模板结果的分组定义（前端按其顺序与名称渲染）；通用结果为 null。
          properties:
            template_version_id:
              type: integer
              format: int64
            name:
              type: string
            groups:
              type: array
              items:
                $ref: '#/components/schemas/TemplateGroup'
        pending_mapping:
          type: object
          nullable: true
          description: 用户最近一次请求、仍在进行（PENDING/MATCHING/CONVERTING）的映射；没有则为 null。
          properties:
            id:
              type: string
            status:
              type: string
              enum: [PENDING, MATCHING, CONVERTING]
            source:
              type: string
              enum: [AUTO, MANUAL]
            template_name:
              type: string
              nullable: true
              description: AUTO 映射匹配完成前为 null。
        latest_failed_mapping:
          type: object
          nullable: true
          description: 最近一次结束的映射为 FAILED 时给出（之后有成功映射则为 null）。
          properties:
            id:
              type: string
            template_name:
              type: string
              nullable: true
            error_code:
              type: string
              description: MATCH_FAILED / LLM_TIMEOUT / LLM_UNAVAILABLE / LLM_INVALID_OUTPUT / RAW_TOO_LARGE / RAW_RESULT_MISSING / TEMPLATE_UNAVAILABLE / MAPPING_INTERRUPTED
            error_message:
              type: string
            source:
              type: string
              enum: [AUTO, MANUAL]
        template_available:
          type: boolean
          description: 功能开启、有 OCR 解析结果且任务租户有可用模板时为 true（显示模板选择入口）。
        validation:
          type: object
          nullable: true
          description: 模板结果的校验提示；通用结果为 null。
          properties:
            required_missing:
              type: array
              description: 必填缺失路径（如 `summary.net_total`、`goods.line_items[0].description`），确认前必须补齐。
              items:
                type: string
            type_warnings:
              type: array
              description: 与模板类型不符的值（仅提示，不阻断保存或确认）。
              items:
                type: object
                properties:
                  path:
                    type: string
                  code:
                    type: string
    ResultCellEdit:
      type: object
      required: [page_number, table_id, row_index, column_index, current_text]
      properties:
        page_number:
          type: integer
          minimum: 1
        table_id:
          type: string
          minLength: 1
        row_index:
          type: integer
          minimum: 0
        column_index:
          type: integer
          minimum: 0
        current_text:
          type: string
          maxLength: 4000
    ResultUpdateRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          description: 客户端所见的当前版本号（须为整数，不接受布尔值）。
        structured:
          description: 完整结构化 JSON（对象或数组，紧凑序列化后 ≤ 2,000,000 字节）；与非空 edits 互斥。
        edits:
          type: array
          description: 旧版逐页结果的单元格编辑；与 structured 互斥。
          items:
            $ref: '#/components/schemas/ResultCellEdit'
        confirm:
          type: boolean
          default: false
          description: 为真时仅已注册非游客可确认并完成；游客 401 auth.login_required，已登录未注册 403 registration.required，拒绝前不写版本/状态。false 仍可保存草稿。

    # ---------- Templates ----------
    TemplateColumn:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
          description: 显示名称（建议「English / ไทย」）。
        type:
          type: string
          enum: [string, integer, decimal, amount]
        required:
          type: boolean
    TemplateItem:
      type: object
      properties:
        kind:
          type: string
          enum: [field, table]
        key:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [string, integer, decimal, amount]
          description: 仅 field。
        required:
          type: boolean
        columns:
          type: array
          description: 仅 table。
          items:
            $ref: '#/components/schemas/TemplateColumn'
    TemplateGroup:
      type: object
      description: 模板分组；items 的顺序即界面与导出顺序。分组 / 字段 / 列的 description 为大模型提示，前端不必展示。
      properties:
        key:
          type: string
        name:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemplateItem'
    TemplateVersionSnapshot:
      type: object
      properties:
        template_id:
          type: integer
          format: int64
        template_version_id:
          type: integer
          format: int64
        version:
          type: integer
        code:
          type: string
          example: system.tax_invoice
        scope:
          type: string
          enum: [system, tenant]
        name:
          type: string
          example: Tax Invoice / ใบกำกับภาษี
        groups:
          type: array
          items:
            $ref: '#/components/schemas/TemplateGroup'
        is_current_version:
          type: boolean
        status:
          type: string
          enum: [ENABLED, DISABLED]
        deleted:
          type: boolean
    TemplateMappingSummary:
      type: object
      description: 一次「任务 + 模板版本」的映射尝试。
      properties:
        id:
          type: string
        status:
          type: string
          enum: [PENDING, MATCHING, CONVERTING, READY, FAILED]
        source:
          type: string
          enum: [AUTO, MANUAL]
        template_id:
          type: integer
          format: int64
          nullable: true
        template_version_id:
          type: integer
          format: int64
          nullable: true
        template_version:
          type: integer
          nullable: true
        template_name:
          type: string
          nullable: true
        match_score:
          type: number
          nullable: true
          description: 自动匹配得分 0~1；单候选直接选中或手动选择为 null。
        low_score:
          type: boolean
          description: 得分低于 TEMPLATE_LOW_SCORE_THRESHOLD（默认 0.7）时为 true，前端提示「匹配度较低，请核对模板」。
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          nullable: true
        finished_at:
          type: string
          nullable: true
    TemplateOption:
      type: object
      properties:
        template_id:
          type: integer
          format: int64
        template_version_id:
          type: integer
          format: int64
        template_version:
          type: integer
        code:
          type: string
        scope:
          type: string
          enum: [system, tenant]
        name:
          type: string
        score:
          type: number
          nullable: true
          description: 最近一次自动匹配给出的得分；没有为 null。
        low_score:
          type: boolean
        recommended:
          type: boolean
          description: 排序第一且有得分。
        generated:
          type: boolean
          description: 该模板版本已有 READY 映射（切换无需等待）。
        ready_mapping_id:
          type: string
          nullable: true
        in_progress_mapping_id:
          type: string
          nullable: true
        is_current:
          type: boolean
    TemplateOptions:
      type: object
      properties:
        raw_result_id:
          type: string
          nullable: true
        enabled:
          type: boolean
        current_mapping_id:
          type: string
          nullable: true
        pending_mapping_id:
          type: string
          nullable: true
        max_mappings:
          type: integer
          description: 每个任务最多映射次数（含失败）。
        mapping_count:
          type: integer
        templates:
          type: array
          items:
            $ref: '#/components/schemas/TemplateOption'
        mappings:
          type: array
          description: 该任务 READY / FAILED 的映射（按创建时间升序）。
          items:
            allOf:
              - $ref: '#/components/schemas/TemplateMappingSummary'
              - type: object
                properties:
                  is_current:
                    type: boolean
    ApplyTemplateRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          description: 客户端所见的当前版本号。
        mapping_id:
          type: string
          description: 切换到该任务一个 READY 映射；传了则忽略其余字段。
        raw_result_id:
          type: string
          description: 按模板套用时必填，取自 GET results 的 raw_result_id。
        template_id:
          type: integer
          format: int64
          description: 按模板套用时必填；使用该模板的当前版本。
        force:
          type: boolean
          default: false
          description: 已有 READY 映射时仍重新生成。
    UseGenericRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version:
          type: integer

    # ---------- Exports ----------
    ExportCreateRequest:
      type: object
      required: [format]
      properties:
        format:
          type: string
          enum: [XLSX, CSV, TXT, JSON]
          description: 大小写不敏感。
    ExportJob:
      type: object
      description: 导出记录（Export.to_dict）。时间为 UTC ISO 8601，无时区后缀。
      properties:
        id:
          type: string
        job_id:
          type: string
        result_version_id:
          type: string
          description: 导出所基于的结果版本 ID。
        format:
          type: string
          enum: [XLSX, CSV, TXT, JSON]
        status:
          type: string
          enum: [GENERATING, READY, EXPIRED, FAILED]
        expires_at:
          type: string
          nullable: true
          description: 过期时间（创建后 24 小时）。
        created_at:
          type: string
          nullable: true

    EnterpriseStatus:
      type: string
      description: 公司审核状态。PENDING_VERIFICATION=待审核；VERIFIED=已生效；SUSPENDED=已暂停；DISABLED=审核不通过/停用。
      enum: [PENDING_VERIFICATION, VERIFIED, SUSPENDED, DISABLED]

    MembershipRole:
      type: string
      description: 成员角色。
      enum: [OWNER, ADMIN, MEMBER]

    Enterprise:
      type: object
      description: 公司（enterprises 表，Enterprise.to_dict()）。enterprises 是企业租户的 1:1 扩展，业务数据一律挂在 tenant_id 上。
      required: [id, tenant_id, code, country, legal_name, registration_no, contact_phone, cert_file_id, status, verified_at]
      properties:
        id:
          type: integer
          format: int64
          description: 公司 ID（自增）。
        tenant_id:
          type: integer
          format: int64
          description: 对应的企业租户 ID（tenants.id，一对一）；文件、OCR 任务、成员、订阅等均以此归属。
        code:
          type: string
          maxLength: 32
          description: 公司编号（系统生成，格式 `ent-YYMMDD-xxxxxx`），用于按编号绑定。
          example: ent-261018-a1b2c3
        country:
          type: string
          maxLength: 8
          description: 国家代码，默认 TH。
          example: TH
        legal_name:
          type: string
          maxLength: 255
          description: 公司名称。
        registration_no:
          type: string
          maxLength: 64
          description: 公司代码（注册号）。
        contact_phone:
          type: string
          maxLength: 32
          description: 联系人手机号，可为空串。
        cert_file_id:
          type: string
          nullable: true
          maxLength: 36
          description: 证明材料文件 ID（files.id，purpose=APPLICATION_MATERIAL）；未上传为 null。
        status:
          $ref: '#/components/schemas/EnterpriseStatus'
        verified_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            认证通过时间（UTC）；status 首次变为 VERIFIED 时由服务端补填。企业租户的默认一个月 Kinder
            自此起算；为 null 表示尚未认证，该租户没有订阅行（订阅 status=NONE）。

    MyCompany:
      description: 我的公司列表项：公司信息 + 我的角色与成员状态。
      allOf:
        - $ref: '#/components/schemas/Enterprise'
        - type: object
          required: [my_role, membership_status]
          properties:
            my_role:
              $ref: '#/components/schemas/MembershipRole'
            membership_status:
              type: string
              description: 我在该公司的成员状态（列表只包含 PENDING 与 ACTIVE）。
              enum: [PENDING, ACTIVE]

    EnterpriseUpsertRequest:
      type: object
      description: 添加/修改公司请求体。所有字符串字段会先 trim 再校验。
      required: [legal_name, registration_no]
      properties:
        legal_name:
          type: string
          minLength: 1
          maxLength: 255
          description: 公司名称（必填）。
        registration_no:
          type: string
          minLength: 1
          maxLength: 64
          description: 公司代码/注册号（必填）。
        contact_phone:
          type: string
          maxLength: 32
          description: 联系人手机号（可选，未提供为空串）。
        cert_file_id:
          type: string
          nullable: true
          description: 证明材料文件 ID；须为本人上传、purpose=APPLICATION_MATERIAL 且 status=READY 的文件。可选；修改时为空则保留原值。

    EnterpriseBindRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          description: 公司编号（enterprises.code，trim 后非空；服务端不校验格式）。
          example: ent-261018-a1b2c3

    EnterpriseJoinResult:
      type: object
      description: 绑定或兑换邀请成功后的结果。
      required: [enterprise, role]
      properties:
        enterprise:
          $ref: '#/components/schemas/Enterprise'
        role:
          $ref: '#/components/schemas/MembershipRole'

    EnterpriseUnbindResult:
      type: object
      required: [enterprise_id, status]
      properties:
        enterprise_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [LEFT]

    MembershipApplicationRequest:
      type: object
      properties:
        message:
          type: string
          maxLength: 500
          description: 申请留言（可选，trim 后不超过 500 字符）。

    MembershipApplication:
      type: object
      description: 入企申请单（applications 表，Application.to_dict()）。时间为 UTC，ISO 8601 无时区后缀。
      required: [id, type, status, form, version, review_note, target_tenant_id, submitted_at, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          description: 申请类型，本接口固定为 MEMBERSHIP。
          enum: [MEMBERSHIP]
        status:
          type: string
          description: 申请状态；新提交为 SUBMITTED。
          enum: [DRAFT, SUBMITTED, UNDER_REVIEW, NEEDS_INFO, APPROVED, REJECTED, WITHDRAWN]
        form:
          type: object
          description: 表单快照。
          properties:
            message:
              type: string
              description: 申请留言（可为空串）。
            enterprise_code:
              type: string
              description: 目标公司编号。
        version:
          type: integer
          description: 乐观并发版本号，新建为 1。
        review_note:
          type: string
          maxLength: 512
          description: 审核备注，新建为空串。
        target_tenant_id:
          type: integer
          format: int64
          description: 目标公司的企业租户 ID（enterprises.tenant_id）。
        submitted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    InvitationCreateRequest:
      type: object
      properties:
        max_uses:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
          description: 最大可兑换次数。
        ttl_hours:
          type: integer
          minimum: 1
          maximum: 720
          default: 72
          description: 有效期（小时），最长 30 天。

    Invitation:
      type: object
      description: 创建邀请的返回结果；token 明文仅在此返回一次。
      required: [id, token, url, expires_at, max_uses]
      properties:
        id:
          type: integer
          format: int64
          description: 邀请 ID。
        token:
          type: string
          description: 邀请令牌明文（URL-safe，32 字符左右）。
        url:
          type: string
          nullable: true
          description: 加入链接 `{APP_BASE_URL}/join?token=...`；未配置 APP_BASE_URL 时为 null。
        expires_at:
          type: string
          format: date-time
          description: 过期时间（UTC，ISO 8601 无时区后缀）。
        max_uses:
          type: integer
          description: 最大可兑换次数。

    InvitationRedeemRequest:
      type: object
      required: [token]
